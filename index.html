<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tinebox">
<title>Tinebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --body:#E2E4E0; --body-2:#D3D6D1; --panel:#EDEEEA; --line:#C6CAC3; --key:#FFFFFF; --key-edge:#B5BAB2; --key-down:#E9EEF8;
  --ink:#1A1E21; --ink-2:#626A6F; --screen:#000; --scr-ink:#DDF1FF; --scr-dim:#6D8897;
  --glass:rgba(24,27,30,.88); --glass-ink:#F3F5F2; --glass-sel:rgba(255,255,255,.17);
  --rec:#D5362B; --go:#2E66D6; --sa:#DDA12A; --sb:#3A9B72; --sc:#6A84D8; --sd:#C064A8; --focus:#2E66D6;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --body:#1C1F21; --body-2:#141719; --panel:#25292B; --line:#3A4043; --key:#32373A; --key-edge:#0E1012; --key-down:#2A3240; --ink:#E8EBE7; --ink-2:#9BA29E; --scr-dim:#5D7888; --glass:rgba(44,48,52,.9); color-scheme:dark; }
}
:root[data-theme="dark"]{ --body:#1C1F21; --body-2:#141719; --panel:#25292B; --line:#3A4043; --key:#32373A; --key-edge:#0E1012; --key-down:#2A3240; --ink:#E8EBE7; --ink-2:#9BA29E; --scr-dim:#5D7888; --glass:rgba(44,48,52,.9); color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;color:var(--ink);background-color:var(--body);
  font-family:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:15px;line-height:1.3;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink)}
input,textarea{-webkit-user-select:text;user-select:text}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:1180px;margin:0 auto;padding:8px 12px 6px}
.panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}

/* display strip: current chord, where you are, the chords in this section */
.top{display:flex;align-items:center;gap:10px;flex:none;height:clamp(48px,14vh,78px)}
.screen{position:relative;flex:1;min-width:0;height:100%;background:var(--screen);color:var(--scr-ink);border-radius:12px;
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:16px;row-gap:3px;padding:6px 24px 6px 14px}
.scr-main{grid-row:1/3;display:flex;align-items:baseline;gap:6px;min-width:clamp(78px,13vw,150px);align-self:center}
.dot{font-family:'Doto',ui-monospace,monospace;font-weight:900}
#sChord{font-size:clamp(26px,9.5vh,50px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scr-num{font-size:14px;color:var(--scr-dim);white-space:nowrap}
.scr-info{display:flex;gap:12px;font-size:13px;color:var(--scr-dim);white-space:nowrap;overflow:hidden;min-width:0}
#sSec{color:var(--scr-ink)}
.scr-sp{flex:1}
#sKey,#sBpm,#sStyle{display:none}
.take-dot{color:#ff6a5e!important}
.lane{position:relative;min-height:14px;border-radius:4px;background:#0C1013;overflow:hidden}
.bl{position:absolute;top:0;bottom:0;width:1px;background:#2A3137}
.blk{position:absolute;top:2px;bottom:2px;background:var(--c);color:#000;font-size:12px;font-weight:700;padding:0 5px;border-radius:3px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;box-shadow:inset -1px 0 0 #000}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--scr-ink);left:0}
.meter{position:absolute;right:9px;top:7px;bottom:7px;display:flex;gap:3px}
.meter i{display:block;width:4px;border-radius:2px;background:#1A2025;position:relative;overflow:hidden}
.meter b{position:absolute;inset:0;background:linear-gradient(to top,#39C07A 0 72%,#E8C33A 72% 90%,#E5483B 90%);clip-path:inset(100% 0 0 0)}
.meter.clip i{box-shadow:0 0 0 1px #E5483B}
.count{position:absolute;inset:0;background:rgba(0,0,0,.94);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:16px;text-align:left;padding:6px 14px}
#countN{font-size:clamp(30px,9vh,56px);line-height:1}
#countT{font-size:15px;color:var(--scr-ink)}
#countS{font-size:13px;color:var(--scr-dim)}

/* transport: two main round keys, two quiet ones */
.transport{display:flex;align-items:center;gap:8px;flex:none}
.transport .tb{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:none;display:grid;place-items:center;padding:0;color:var(--ink)}
.transport .tb.main{width:clamp(44px,13vh,58px);height:clamp(44px,13vh,58px);background:var(--key);box-shadow:0 0 0 1px var(--line),0 2px 0 var(--key-edge)}
.transport .tb svg{width:19px;height:19px}
.transport .tb.main svg{width:24px;height:24px}
.transport .tb:active{transform:scale(.95)}
.transport .tb.play[aria-pressed="true"]{background:var(--go);color:#fff;box-shadow:none}
.transport .tb .rd{width:16px;height:16px;border-radius:50%;background:var(--rec)}
.transport .tb.rec[aria-pressed="true"]{background:var(--rec);box-shadow:none}
.transport .tb.rec[aria-pressed="true"] .rd{background:#fff}
.transport .tb.tog[aria-pressed="true"]{background:var(--ink);color:var(--body)}

/* song bar: section letters to switch live, then the whole arrangement */
.songbar{display:flex;align-items:center;gap:8px;flex:none;height:clamp(30px,9vh,40px)}
.secs{display:flex;gap:6px;flex:none;height:100%}
.sec{position:relative;flex:none;height:100%;aspect-ratio:1/1;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;display:grid;place-items:center;color:var(--ink)}
.sec b{font-size:15px;line-height:1}
.sec span,.sec small{display:none}
.sec.cur{background:var(--c);color:#000}
.sec.q{outline:2px dashed var(--c);outline-offset:2px;animation:blinkq .5s steps(2) infinite}
@keyframes blinkq{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.sec.q,.scard.q{animation:none}}
.songline{position:relative;flex:1;min-width:0;height:100%;border-radius:8px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow:hidden}
.songline.off .sblk{opacity:.4}
.sblk{position:absolute;top:3px;bottom:3px;border-radius:5px;background:color-mix(in srgb,var(--c) 72%,var(--key));color:#000;font-size:11px;font-weight:700;
  padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:inset -1px 0 0 rgba(0,0,0,.18)}
.sblk.now{box-shadow:inset 0 0 0 2px var(--ink)}
.sph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rec);z-index:1}
.sl-empty{display:flex;align-items:center;height:100%;padding:0 12px;font-size:13px;color:var(--ink-2);white-space:nowrap}

/* floating icon bar */
.tabbar{flex:none;align-self:center;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 6px 20px rgba(0,0,0,.16),inset 0 0 0 1px rgba(255,255,255,.07)}
.tabbar button{width:clamp(52px,8vw,72px);height:clamp(36px,9.5vh,44px);border:0;border-radius:999px;background:transparent;color:var(--glass-ink);display:grid;place-items:center;opacity:.7;padding:0}
.tabbar button[aria-selected="true"]{background:var(--glass-sel);opacity:1}
.tabbar svg{width:23px;height:23px}

/* shared controls */
h3{font-size:17px;font-weight:700;margin:20px 0 6px}
.pnl > h3:first-child{margin-top:4px}
.seg{display:flex;flex-wrap:wrap;background:var(--body-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:7px;padding:7px 5px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--key);color:var(--ink);box-shadow:0 1px 0 var(--key-edge)}
.orow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.orow .seg{flex:1 1 auto}
.lbl{font-size:14px;color:var(--ink-2);min-width:88px}
.tog,.btn{border:1px solid var(--line);background:var(--key);border-radius:8px;padding:7px 11px;font-weight:600;font-size:14px;box-shadow:0 2px 0 var(--key-edge)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}
.btn:active,.tog:active{transform:translateY(2px);box-shadow:none}
.btn.sm{padding:4px 9px}
.btn.danger{color:var(--rec)}
select{border:1px solid var(--line);background:var(--key);border-radius:8px;padding:6px 8px;max-width:100%}
.rng{display:grid;grid-template-columns:72px 1fr 62px;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.rng output{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:14px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.note,.hint,.status{font-size:14px;color:var(--ink-2);line-height:1.4;max-width:62ch;margin:6px 0}
.hint{text-align:center;margin-top:12px}
.status{color:var(--ink)}

/* play: stick | keys | options */
.pnl-play{width:100%;height:100%;min-height:136px;max-height:340px;margin:auto 0;display:grid;grid-template-columns:auto minmax(0,1fr) clamp(178px,22vw,240px);gap:clamp(12px,2.6vw,30px)}
.stickcol{display:flex;align-items:center;justify-content:center;min-height:0}
.stick{position:relative;height:100%;max-height:230px;width:auto;aspect-ratio:1/1;border-radius:50%;border:1px solid var(--line);touch-action:none;
  background:radial-gradient(circle at 50% 50%,var(--body-2) 0 30%,var(--panel) 31% 100%)}
.sl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--ink-2);pointer-events:none;white-space:nowrap}
.sl.on{color:var(--go)}
.knob{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:var(--key);
  box-shadow:0 2px 0 var(--key-edge),inset 0 -5px 8px rgba(0,0,0,.06);transition:transform .12s ease-out;pointer-events:none}
.stick.drag .knob{transition:none}
.keys{display:flex;flex-direction:column;gap:8px;min-height:0;touch-action:none}
.krow{display:grid;gap:8px;min-height:0}
.krow.top{flex:.82;grid-template-columns:repeat(3,1fr);padding:0 12.5%}
.krow.bot{flex:1;grid-template-columns:repeat(4,1fr)}
.key{height:100%;border:1px solid var(--line);background:var(--key);border-radius:12px 12px 16px 16px;box-shadow:0 2px 0 var(--key-edge);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 3px 8px;touch-action:none;min-width:0;min-height:0}
.key .kn{font-size:clamp(17px,5.2vh,25px);font-weight:700;line-height:1}
.key .kc{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;max-width:100%}
.key.down{transform:translateY(2px);box-shadow:none;background:var(--key-down);border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.opts{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;padding:2px 0}
.orow2{display:flex;gap:6px;align-items:center}
.orow2 select{flex:1;min-width:0;height:36px;padding:0 8px;border:0;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:600}
.orow2 .tog{flex:1;padding:6px 2px}
.opts .seg{flex-wrap:nowrap;padding:2px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.opts .seg button{padding:6px 2px;font-size:13px}
.stp{flex:1;display:flex;align-items:stretch;height:36px;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow:hidden;min-width:0}
.stp button{border:0;background:transparent;width:32px;flex:none;font-size:18px;line-height:1;color:var(--ink);padding:0}
.stp button:active{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.stp output{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;min-width:0}
.stp b{font-size:15px;font-variant-numeric:tabular-nums}
.stp small{font-size:10px;color:var(--ink-2);margin-top:2px}
.opts .more{flex:none;width:40px;height:36px;padding:0;border:0;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:none;display:grid;place-items:center}
.opts .more[aria-expanded="true"]{background:var(--ink);color:var(--body)}
.opts .more svg{width:20px;height:20px}
.pop{position:fixed;z-index:45;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(290px,calc(100vw - 28px));
  background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.22),0 0 0 1px var(--line)}
.lp-note{margin:0;font-size:12px}
.dg-badge{display:inline-block;vertical-align:2px;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.dg-badge.pass{background:color-mix(in srgb,#39C07A 28%,transparent)}
.dg-badge.warn{background:color-mix(in srgb,#E8C33A 34%,transparent)}
.dg-badge.fail{background:color-mix(in srgb,#E5483B 30%,transparent)}
.dg-badge.info{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.dg-x{white-space:pre-wrap;font-size:12px}
.lp-meter{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.lp-meter i{display:block;height:100%;width:0;background:var(--go);transition:width .08s linear}
.pop .pl{flex:none;min-width:58px;font-size:14px;color:var(--ink-2)}
.pop .orow2 .tog{height:34px}

/* drums */
.grid{display:grid;grid-template-columns:40px repeat(16,1fr);gap:3px 2px;align-items:center}
.gl{font-size:13px;font-weight:600;color:var(--ink-2)}
.cell{aspect-ratio:3/4;border:0;border-radius:3px;background:var(--key);box-shadow:inset 0 0 0 1px var(--line);padding:0;min-width:0}
.cell.alt{background:var(--body-2)}
.cell.on{background:var(--ink);box-shadow:none}
.cell.acc{background:var(--go);box-shadow:none}
.cell.now{outline:2px solid var(--rec);outline-offset:-1px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;touch-action:none}
.pad{height:64px;border-radius:10px;border:1px solid var(--line);background:var(--key);box-shadow:0 3px 0 var(--key-edge);font-weight:600;font-size:15px}
.pad.hit{transform:translateY(3px);box-shadow:none;background:var(--key-down)}

/* song */
/* arrange, song view: sections on the left, song order on the right */
.pnl-song{display:block;max-width:720px}
.se{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.se .msel{width:92px;flex:none}
.se .msel,.se .ibtn,.se input.nm{height:30px}
.se .chip{width:26px;height:26px}
.chip{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#000;font-weight:700;flex:none}
input.nm{flex:1;min-width:0;height:34px;padding:0 10px;border:0;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:600}
.secmenu{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;font-size:18px;font-weight:700;line-height:1;cursor:pointer}
.chain-tiles{display:flex;gap:6px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none;min-height:48px;align-items:center}
.chain-tiles::-webkit-scrollbar{display:none}
.ctile{flex:none;min-width:46px;height:42px;border:0;border-radius:10px;background:color-mix(in srgb,var(--c) 72%,var(--key));color:#000;font-weight:700;font-size:15px;padding:0 11px;display:flex;align-items:center;justify-content:center;gap:2px}
.ctile small{font-size:12px;font-weight:600;opacity:.7}
.ctile.sel{box-shadow:0 0 0 2px var(--body),0 0 0 4px var(--ink)}
.ctile.now{outline:2px solid var(--rec);outline-offset:-2px}
.chain-empty{display:flex;align-items:center;min-height:42px;font-size:14px;color:var(--ink-2)}
.chain-tools{display:flex;align-items:center;gap:6px;min-height:36px;margin-top:8px}
.ct-label{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-hint{font-size:14px;color:var(--ink-2)}
.chain-tools output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.chain-add{display:flex;align-items:center;gap:8px;margin-top:8px}
.lbl2{font-size:14px;color:var(--ink-2);margin-right:2px}
.addchip{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--ink);font-weight:700;padding:0}
.addchip:active{background:var(--c);color:#000}
.pnl-song #chainMeta{margin:10px 0 0}

/* tp-7 */
.take{width:100%;height:54px;border-radius:12px;border:0;background:var(--rec);color:#fff;font-size:18px;font-weight:700;margin-top:10px;box-shadow:0 3px 0 #8E2019}
.take:active{transform:translateY(3px);box-shadow:none}
.take.live{background:var(--ink);color:var(--body);box-shadow:0 3px 0 #000}
.cues{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.cues li{display:grid;grid-template-columns:78px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.cues small{color:var(--ink-2)}
.cues li.empty{display:block;color:var(--ink-2);font-size:14px}
textarea{width:100%;height:140px;border-radius:8px;border:1px solid var(--line);background:var(--key);padding:8px;font-size:14px}
#peakOut{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}

/* chords editor */
/* arrange, chords view: palette, one tools row, the section's bars side by side */
.pnl-chords{display:flex;flex-direction:column;gap:6px}
.pal{position:static;background:none;padding:0;margin:0}
.pal-keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ptile{height:clamp(36px,11vh,54px);border:0;background:var(--key);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 2px 0 var(--key-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px;touch-action:none;min-width:0}
.ptile b{font-size:16px;line-height:1;white-space:nowrap}
.ptile span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.01em}
.ptile.sel{background:var(--ink);border-color:var(--ink);color:var(--body)}
.ptile.sel span{color:var(--body)}
.ch-tools{display:flex;align-items:center;gap:8px;min-height:32px}
.ch-tools .msel,.ch-tools .ibtn{height:32px}
.ch-tools .ibtn{width:32px}
.pal-shape{flex:1 1 auto;min-width:0;margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ch-set,.ch-sel{flex:none;display:flex;align-items:center;gap:6px}
.ch-sel .selinfo{font-size:14px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:2px}
.msel{height:34px;border:0;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:0 8px;font-weight:600;max-width:132px}
.ibtn{width:34px;height:34px;border:0;border-radius:9px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);display:grid;place-items:center;padding:0;flex:none;font-size:18px;line-height:1}
.ibtn svg{width:18px;height:18px}
.ibtn.danger{color:var(--rec)}
.ibtn:active{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.pal-shape::-webkit-scrollbar{display:none}
.pal-shape button{flex:1 0 auto;padding:6px 7px;font-size:13px}
.tl{display:grid;grid-template-columns:repeat(var(--bpr,4),minmax(0,1fr));gap:4px 6px;margin:0}
.trow{display:flex;flex-direction:column;gap:2px;min-width:0}
.tbar{font-size:11px;font-weight:600;color:var(--ink-2);padding-left:2px;line-height:12px}
.tl .tg{height:clamp(40px,12vh,58px)}
.tl-hint{grid-column:1/-1;margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.tg{position:relative;height:50px;border-radius:7px;background-color:var(--panel);box-shadow:inset 0 0 0 1px var(--line);
  background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 100%}
.tg.fine{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-size:25% 100%,12.5% 100%}
.tblk{position:absolute;top:4px;bottom:4px;background:color-mix(in srgb,var(--c) 78%,var(--key));border:1px solid color-mix(in srgb,var(--c) 55%,#000);border-radius:6px;color:#000;padding:2px 5px;overflow:hidden;white-space:nowrap;touch-action:none;display:flex;flex-direction:column;justify-content:center}
.tblk b{font-size:15px;line-height:1.1}
.tblk small{font-size:11px;opacity:.7}
.tblk.cont{border-left-style:dashed;border-top-left-radius:0;border-bottom-left-radius:0}
.tblk.more{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
.tblk.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.tprev{position:absolute;top:4px;bottom:4px;border-radius:6px;border:2px dashed var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);pointer-events:none;z-index:2}
.tph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rec);pointer-events:none;z-index:2}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;margin:-58px 0 0 -32px;min-width:64px;padding:8px 10px;border-radius:9px;background:var(--ink);color:var(--body);font-weight:700;font-size:16px;text-align:center}


/* take card, checklist, takes log */
.takecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin-top:2px}
.tk-state{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tk-state.rec{color:var(--rec)}
.tk-small{font-size:15px;margin-top:3px;min-height:20px}
.tk-sum{font-size:14px;color:var(--ink-2);margin-top:6px}
.takecard .take{margin-top:10px}
.tplcard{margin-top:10px}
.tpl-dub{height:72px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tpl-dub.on{background:#fff;color:var(--rec);box-shadow:inset 0 0 0 3px var(--rec)}
.tpl-pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tpl-pads .btn{width:100%}
.tpl-key{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpl-key .btn.sm{margin:0}
.pedcard{margin-top:10px}
.pedrow{display:flex;gap:6px;margin:8px 0}
.pedsw{flex:1;text-align:center;padding:8px 0;border-radius:8px;border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.pedsw.on{background:var(--rec);border-color:var(--rec);color:#fff}
.pedcard select{flex:1;min-width:0}
.take:disabled{opacity:.55}
h3 small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:6px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.ckbox{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--key);font-weight:700;font-size:16px;color:transparent;padding:0;line-height:1}
.chk li.on .ckbox{background:var(--sb);border-color:var(--sb);color:#fff}
.chk p{margin:3px 0 0;font-size:15px;line-height:1.35}
.chk li.on p{color:var(--ink-2)}
.chk .opt{font-size:12px;font-weight:700;color:var(--ink-2);margin-right:4px}
.chk .orow{margin:8px 0 0}
.takes{list-style:none;margin:0;padding:0}
.takes > li{border-top:1px solid var(--line);padding:8px 0}
.takes summary{cursor:pointer;font-size:15px}
.takes summary b{margin-right:6px}
.takes ol{list-style:none;margin:6px 0 0;padding:0;font-variant-numeric:tabular-nums;font-size:14px}
.takes ol li{display:grid;grid-template-columns:72px 1fr auto;gap:8px;padding:3px 0}
.takes ol small{color:var(--ink-2)}
.takes li.empty{color:var(--ink-2);font-size:14px;border-top:0}
details.more{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
details.more > summary{font-weight:700;font-size:16px;padding:8px 0;cursor:pointer}

/* take review */
.tk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
.tk-row b{margin-right:4px}
canvas.mini{display:block;width:100%;height:38px;margin-top:6px;border-radius:6px}
.review{position:fixed;inset:0;z-index:45;background:var(--body);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
.rv-in{max-width:760px;margin:0 auto}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv-head h2{margin:0;font-size:24px}
.wv{display:block;width:100%;height:210px;border-radius:10px;background:#000;touch-action:none;margin-top:10px;cursor:crosshair}
#rvView{margin-top:10px}
.rv-read{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.rv-read b{font-size:20px}
.rv-read span{color:var(--ink-2);font-size:15px}
.rv-btns{display:grid;grid-template-columns:1fr 1fr 0.7fr;gap:8px;margin-top:8px}
.rv-btns .btn{height:50px;font-size:15px}
.btn:disabled{opacity:.45}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
#rvCues{list-style:none;margin:0;padding:0}
#rvCues li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
#rvCues small{color:var(--ink-2)}

/* diagnostics */
.dg-card{border-top:1px solid var(--line);padding:14px 0 10px}
.dg-card h4{font-size:17px;margin:0 0 4px}
.dg-how{font-size:14px;color:var(--ink-2);margin:0 0 6px;line-height:1.4}
.dg-q{font-weight:600;font-size:15px;margin:10px 0 5px}
.dg-seg button{flex:1 1 40%}
.dg-l{display:block;font-size:14px;color:var(--ink-2);margin:10px 0}
.dg-in,.dg-ta{display:block;width:100%;margin-top:6px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--key)}
.dg-ta{height:auto;min-height:64px;resize:vertical}
.dg-pre{white-space:pre-wrap;word-break:break-word;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--panel);border-radius:8px;padding:8px 10px;margin:6px 0;-webkit-user-select:text;user-select:text}
.dg-pre:empty{display:none}
.dg-report{width:100%;height:240px;font:13px/1.45 ui-monospace,Menlo,monospace;border-radius:8px;border:1px solid var(--line);background:var(--key);padding:8px}

/* panel layouts per tab */
.songbar .songtog{flex:none;height:100%;padding:0 14px;border-radius:999px;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:none;font-size:13px}
.songbar .songtog[aria-pressed="true"]{background:var(--ink);color:var(--body)}
.panel.tab-play{overflow-y:auto;display:flex;flex-direction:column}
.panel.tab-arrange{display:grid;grid-template-columns:auto minmax(0,1fr);grid-auto-rows:min-content;column-gap:16px;row-gap:14px;overflow-y:auto;align-content:start}
.panel.tab-arrange>.arr-rail{grid-column:1;grid-row:1/span 6;position:sticky;top:0;align-self:start}
.panel.tab-arrange>.pnl:not(.arr-rail){grid-column:2;min-height:0}
.scards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;background:var(--panel);padding:7px 9px 8px;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;text-align:left;color:inherit;font:inherit}
.scard.now .sc-top::after{content:"";flex:none;width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--go)}
.scard.q{outline:2px dashed var(--c);outline-offset:2px;animation:blinkq .5s steps(2) infinite}
.song-on{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.song-on .tog{height:38px;padding:0 14px}
.scard.sel{box-shadow:0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.sc-top{display:flex;align-items:center;gap:7px;min-width:0}
.sc-top .chip{width:24px;height:24px;flex:none;font-size:13px}
.sc-nm{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-top small{color:var(--ink-2);font-size:12px;flex:none}
.sc-loop{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-loop.on{color:var(--ink)}
.sc-loop.live{color:var(--go)}
.sc-loop.rec{color:var(--rec,#d33)}
.sc-sum{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-head{display:flex;align-items:center;gap:8px;margin-top:10px;min-width:0}
.sec-head .chip{width:30px;height:30px;flex:none}
.sec-head .nm{flex:1 1 140px;min-width:0;max-width:260px;height:36px}
.sec-head .msel{flex:0 0 auto;height:36px}
.sec-head .ibtn{flex:none;height:36px;width:44px}
.arr-h{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px;font-size:15px}
.arr-h small{font-weight:500;color:var(--ink-2);font-size:13px}
.arr-rail{display:flex;flex-direction:column;gap:6px;width:76px}
.arr-rail button{border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;padding:9px 8px;text-align:left}
.arr-rail button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.stp .tapout{flex:1;width:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;min-width:0;font-size:inherit;border-radius:0;touch-action:manipulation}
.stp .tapout:active{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.tapout.flash{animation:tapf .22s ease-out}
@keyframes tapf{from{background:color-mix(in srgb,var(--go) 40%,transparent)}}
@media (prefers-reduced-motion:reduce){.tapout.flash{animation:none}}
.pnl-set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;align-items:start}
.pnl-set>div>h3:first-child{margin-top:4px}
.pnl-rec{display:grid;grid-template-columns:clamp(220px,32%,330px) minmax(0,1fr);gap:18px;align-items:start}
.rec-l{position:sticky;top:0}
@media (max-height:440px){ .rec-l{position:static} .tk-state{font-size:22px} .takecard .take{height:46px;margin-top:8px} }
.rec-r>h3:first-child{margin-top:4px}
.pnl-drums{display:block}
.drum-ctl{margin:0 0 8px;flex-wrap:nowrap}
.drum-ctl .seg{flex:1 1 auto;flex-wrap:nowrap}
.drum-ctl select{flex:0 1 auto;min-width:0}
.pnl-drums .cell{aspect-ratio:auto;height:clamp(15px,5vh,30px)}
.panel.tab-drums{overflow-y:auto;display:flex;flex-direction:column}
.pnl-pads{width:100%;height:100%;min-height:150px;max-height:360px;margin:auto 0;display:grid;grid-template-columns:minmax(0,1fr) clamp(178px,22vw,240px);gap:clamp(12px,2.6vw,30px)}
.pnl-pads .pads{margin:0;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:100%;min-height:0;gap:10px}
.pnl-pads .pad{height:auto;font-size:18px;display:flex;align-items:flex-end;justify-content:flex-start;padding:10px 12px;border-radius:14px}
.pnl-pads .pad.hit{transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge);background:color-mix(in srgb,var(--go) 22%,var(--key))}
.pad-opts{justify-content:flex-start;overflow-y:auto}
.pad-opts .seg{flex-wrap:wrap}
.pad-opts .rng{grid-template-columns:52px 1fr 52px}

/* the layout: upright phone (build 62: the only layout, landscape dropped) */
@media all{
  #app{padding:8px 12px 6px;max-width:640px;gap:10px}
  .top{flex-direction:column;align-items:stretch;height:auto;gap:10px}
  .screen{min-height:120px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(22px,auto)}
  .scr-main{grid-row:auto}
  #sChord{font-size:44px}
  .transport{justify-content:center;gap:14px}
  .songbar{height:40px}
  .pnl-play{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(150px,1fr);height:100%;min-height:0;max-height:none;margin:0;row-gap:12px}
  .stickcol{grid-column:1;grid-row:1}
  .stick{height:clamp(112px,21vh,150px)}
  .opts{grid-column:2;grid-row:1}
  .keys{grid-column:1/-1;grid-row:2;height:auto;min-height:150px}
  .key .kn{font-size:clamp(20px,3.6vh,28px)}
  .key .kc{font-size:14px}
  .pnl-play>.stickcol,.pnl-play>.opts{min-height:auto}
  .panel.tab-arrange{display:block;overflow-y:auto}
  .panel.tab-arrange>.pnl{overflow:visible}
  .arr-rail{flex-direction:row;width:auto;margin-bottom:10px}
  .pnl-song{grid-template-columns:minmax(0,1fr)}
  .pnl-set,.pnl-rec,.pnl-drums{grid-template-columns:minmax(0,1fr)}
  .rec-l{position:static}
  .pnl-drums .cell{height:auto;aspect-ratio:3/4}
  .pnl-drums{height:auto}
  .panel.tab-arrange>.pnl+.pnl{margin-top:16px}
  .panel.tab-arrange>.arr-rail{position:static}
  .pad-opts .rng{grid-template-columns:64px 1fr 58px}
  .scards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pnl-pads{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto;max-height:none;margin:0;gap:14px}
  .pnl-pads .opts{grid-column:auto;grid-row:auto;overflow:visible}
  .pnl-pads .pads{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:min(36vh,300px)}
  .drum-ctl{flex-wrap:wrap}
}
@media (max-height:620px){ .screen{min-height:96px} #sChord{font-size:36px} .transport .tb.main{width:50px;height:50px} }

/* guitar looper */
.transport #loopBtn[aria-pressed="true"]{background:var(--sb);color:#fff}
.lp-pop{width:min(330px,calc(100vw - 28px));gap:8px;padding:10px 12px;max-height:calc(100% - 76px);overflow:auto}
.lp-pop .orow2 .tog{flex:none;padding:6px 12px}
.lp-level{flex:1;min-width:0}
.lp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lp-head b{font-size:16px}
.lp-state{font-size:13px;color:var(--ink-2);text-align:right}
.lp-pop .take{height:40px;margin:0;font-size:16px}
.lp-pop .take:disabled{opacity:.6}
.lp-lat{flex:1;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* footswitch test prompts: readable with the phone on the floor */
.ped-prompt{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:47;background:var(--ink);color:var(--body);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:640px;margin:0 auto}
.ped-prompt b{font-size:26px;line-height:1.15}
.ped-prompt span{font-size:15px;opacity:.85}
#ppBeat{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:24px;opacity:1}
#ppBeat:empty{display:none}
#ppBeat.now{color:#ff6a5e}
.review .dg-card:last-of-type{margin-bottom:140px}

/* overlay + toast */
.start{position:fixed;inset:0;z-index:50;background:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.start h1{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:52px;margin:0;line-height:1}
.start p{max-width:34ch;margin:0;color:var(--ink-2);font-size:16px;line-height:1.4}
.start button{height:56px;min-width:200px;border-radius:14px;border:0;background:var(--ink);color:var(--body);font-size:19px;font-weight:700;box-shadow:0 4px 0 #000}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--body);padding:10px 14px;border-radius:10px;font-weight:600;max-width:90vw;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.knob{transition:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#E2E4E0">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="screen" id="screen">
      <div class="scr-main"><div id="sChord" class="dot">·</div><div id="sNum" class="scr-num"></div></div>
      <div class="scr-info"><span id="sSec"></span><span id="sBar"></span><span id="sNext"></span><span class="scr-sp"></span><span id="sKey"></span><span id="sBpm"></span><span id="sStyle"></span><span id="sTake" class="take-dot" hidden>● Take</span></div>
      <div class="lane" id="lane"><div id="laneBlocks"></div><div class="playhead" id="playhead" hidden></div></div>
      <div class="meter" id="meter" aria-hidden="true"><i><b id="mL"></b></i><i><b id="mR"></b></i></div>
      <div class="count" id="count" hidden><div id="countN" class="dot"></div><div><div id="countT"></div><div id="countS"></div></div></div>
    </div>
    <div class="transport">
      <button class="tb main play" id="btnPlay" data-act="play" aria-pressed="false" aria-label="Play"></button>
      <button class="tb main rec" id="btnRec" data-act="rec" aria-pressed="false" aria-label="Record chords into the loop" title="Record into the loop"><i class="rd"></i></button>
      <button class="tb" data-act="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tb tog" data-k="metro" aria-pressed="false" aria-label="Metronome" title="Metronome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 3.5h4.8l4.1 16.2a.8.8 0 0 1-.8 1H6.3a.8.8 0 0 1-.8-1z"/><path d="M8 15.5h8"/><path d="M12 15.5 16.5 7"/></svg></button>
      <button class="tb" id="loopBtn" data-act="loopPop" aria-pressed="false" aria-haspopup="dialog" aria-expanded="false" aria-label="Guitar looper" title="Guitar looper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h16"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
    </div>
  </header>
  <div class="songbar" hidden>
    <div class="secs" id="secs"></div>
    <div class="songline" id="songline" title="Song timeline"><div id="songBlocks"></div><i class="sph" id="songHead" hidden></i></div>
    <button type="button" class="tog songtog" data-k="songMode" aria-pressed="false" title="Play the arrangement">Song</button>
  </div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const parseV=s=>/^-?\d+(\.\d+)?$/.test(s)?Number(s):s;

/* ================= MUSIC START ================= */
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MODES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10]};
const ROMAN=['I','II','III','IV','V','VI','VII'];
const DIR_LABEL={u:'7',ur:'9',r:'add9',dr:'6',d:'sus4',dl:'sus2',l:'flip',ul:'V7'};
const DIR_ADD={c:'',u:'7',ur:'9',r:'add9',dr:'6',d:'sus4',dl:'sus2',l:'',ul:'7'};

function sc(deg){ const m=MODES[S.mode]; return m[deg%7]+12*Math.floor(deg/7); }
function triName(t,f){ if(t===4&&f===7) return ''; if(t===3&&f===7) return 'm'; if(t===3&&f===6) return '°'; if(t===4&&f===8) return '+'; return ''; }
function sevName(t,f,s){
  if(t===4&&f===7&&s===11) return 'maj7'; if(t===4&&f===7&&s===10) return '7'; if(t===3&&f===7&&s===10) return 'm7';
  if(t===3&&f===6&&s===10) return 'm7♭5'; if(t===3&&f===6&&s===9) return '°7'; if(t===3&&f===7&&s===11) return 'm(maj7)';
  return triName(t,f)+'7';
}
function nineName(t,f,s,n){
  const b=sevName(t,f,s);
  if(n===14){ if(b==='maj7') return 'maj9'; if(b==='7') return '9'; if(b==='m7') return 'm9'; return b+'(9)'; }
  if(n===13) return b+'(♭9)';
  return b+'(♯9)';
}
function chordFor(deg,dir){
  const r=sc(deg), t=sc(deg+2)-r, f=sc(deg+4)-r, s=sc(deg+6)-r, n=sc(deg+8)-r;
  const tri=triName(t,f); let ints, suf;
  switch(dir){
    case 'u':  ints=[0,t,f,s]; suf=sevName(t,f,s); break;
    case 'ur': ints=f===7?[0,t,s,n]:[0,t,f,s,n]; suf=nineName(t,f,s,n); break;
    case 'r':  ints=[0,t,f,14]; suf=tri==='m'?'m(add9)':tri+'add9'; break;
    case 'dr': ints=[0,t,f,9]; suf=tri==='°'?'°7':tri+'6'; break;
    case 'd':  ints=[0,5,7]; suf='sus4'; break;
    case 'dl': ints=[0,2,7]; suf='sus2'; break;
    case 'l':  { const t2=t===4?3:4; ints=[0,t2,7]; suf=t2===3?'m':''; break; }
    case 'ul': ints=[0,4,7,10]; suf='7'; break;
    default:   ints=[0,t,f]; suf=tri;
  }
  return {rootRel:r%12, ints, suf};
}
function chName(ch){ return NOTE[(S.key+ch.rootRel)%12]+ch.suf; }
function numeral(deg,ch,dir){
  let r=ROMAN[deg]; if(ch.ints[1]===3) r=r.toLowerCase();
  if(dir==='c'&&ch.suf==='°') r+='°';
  return r+DIR_ADD[dir];
}
let lastVoicing=null;
function scoreV(notes){
  const mean=notes.reduce((a,b)=>a+b,0)/notes.length;
  if(!lastVoicing||!lastVoicing.length) return Math.abs(mean-61);
  let s=0;
  for(const x of notes){ let m=99; for(const p of lastVoicing) m=Math.min(m,Math.abs(p-x)); s+=m; }
  for(const p of lastVoicing){ let m=99; for(const x of notes) m=Math.min(m,Math.abs(p-x)); s+=m; }
  return s+Math.abs(mean-61)*0.6;
}
function voiceChord(ch){
  const rp=(S.key+ch.rootRel)%12, ints=ch.ints, n=ints.length;
  let best=null;
  if(S.voiceLead){
    for(let k=0;k<n;k++){
      const rot=ints.slice(k).concat(ints.slice(0,k).map(x=>x+12));
      const lowPc=(rp+rot[0])%12;
      for(let L=48;L<66;L++){
        if(L%12!==lowPc) continue;
        const notes=rot.map(x=>L+x-rot[0]).sort((a,b)=>a-b);
        if(notes[0]<47||notes[notes.length-1]>81) continue;
        const s=scoreV(notes);
        if(!best||s<best.s) best={notes,s};
      }
    }
  }
  if(!best){ let L=rp; while(L<53) L+=12; best={notes:ints.map(x=>L+x).sort((a,b)=>a-b)}; }
  lastVoicing=best.notes.slice();
  return {notes:best.notes.map(x=>x+12*S.octave), bass:S.bass?36+rp:null};
}
/* ================= MUSIC END ================= */

const LETTERS=['A','B','C','D'];
const SEC_COLORS=['var(--sa)','var(--sb)','var(--sc)','var(--sd)'];

const STYLE_NAME={hold:'Hold',strum:'Strum',pulse:'Pulse',arp:'Arp'};
const PRESETS={

  reed:  {name:'Reed',     body:2.6, bodyRatio:1,tine:0.25,tineRatio:5, tineMix:0.2, decay:1.3,release:0.05,tone:0.42,bark:0.65,trem:0.45,tremRate:5.8,tremMode:'amp',chorus:0,   delay:0.05,reverb:0.15},
  fm:    {name:'Bright FM',body:0.9, bodyRatio:1,tine:0.9, tineRatio:14,tineMix:0.6, decay:2.8,release:0.09,tone:0.85,bark:0.12,trem:0,   tremRate:4,  tremMode:'pan',chorus:0.55,delay:0.14,reverb:0.28},
  mellow:{name:'Mellow',   body:0.65,bodyRatio:1,tine:0.22,tineRatio:14,tineMix:0.2, decay:3,  release:0.1, tone:0.28,bark:0.18,trem:0.3, tremRate:3.4,tremMode:'pan',chorus:0.3, delay:0.12,reverb:0.32}

const KITS={
  studio:{name:'Studio', kHi:150,kLo:50,kSw:0.08,kDec:0.38,kClick:0.35,snDec:0.17,snTone:190,snBP:3000,hat:0.045,oh:0.35,lp:16000,perc:'rim'},
  tr:    {name:'Machine',kHi:115,kLo:41,kSw:0.13,kDec:0.95,kClick:0,   snDec:0.2, snTone:235,snBP:4200,hat:0.035,oh:0.5, lp:15000,perc:'rim'},
  dusty: {name:'Dusty',  kHi:125,kLo:47,kSw:0.07,kDec:0.3, kClick:0.2, snDec:0.13,snTone:175,snBP:2000,hat:0.035,oh:0.22,lp:4800, perc:'shaker'}
};
const DRUM_PRESETS={
  pop:  {name:'Soft pop',          t:['X.......X.x.....','....X.......X...','................','x.x.x.x.x.x.x.x.','..............x.','................']},
  four: {name:'Four on the floor', t:['X...X...X...X...','................','....X.......X...','x...x...x...x...','..X...X...X...X.','................']},
  boom: {name:'Boom bap',          t:['X......x..X.....','....X.......X...','................','x.x.x.x.x.x.x.x.','................','..............x.']},
  half: {name:'Half-time',         t:['X.........x.....','........X.......','................','x.x.x.x.x.x.x.x.','................','......x.......x.']},
  bossa:{name:'Bossa',             t:['X..xX..xX..xX..x','................','................','x.x.x.x.x.x.x.x.','................','X..X..X...X..X..']},
  empty:{name:'Empty',             t:['','','','','','']}
};
function pat(str){ const a=[]; for(let i=0;i<16;i++){ const c=str[i]; a.push(c==='X'?2:c==='x'?1:0); } return a; }
function pat6(k){ return DRUM_PRESETS[k].t.map(pat); }

function defaults(){
  return {
    v:1,key:0,mode:'major',bpm:92,swing:0,quant:1,style:'hold',voiceLead:true,bass:false,octave:0,latch:false,metro:false,
    snd:Object.assign({preset:'tine'},PRESETS.tine),kit:'studio',lv:{keys:0.8,drums:0.75,master:0.8},
    sections:['Verse','Chorus','Bridge','Outro'].map(name=>({name,bars:4,chords:[],drums:pat6('empty')})),
    songMode:false,chain:[{sec:0,rep:2},{sec:1,rep:2},{sec:0,rep:1},{sec:2,rep:1},{sec:1,rep:2}],songEnd:'stop',switchAt:'loop',autoFill:true,
    edLen:16,edSnap:4,
    tp:{split:0,preroll:2,slate:true,tail:4,midiCue:true,midiRec:false,midiLoop:-1,takeMode:'loop',takeReps:4,countIn:true,chk:{},cueEvery:1,startMode:'start',clock:false,midiOffset:0,mig2:true},
    takes:[],takeN:0,

    looper:{bars:2,level:0.8,muted:false,lat:null,latHow:'',strumTempo:false}
  };
}
function mkEvent(deg,dir,s,len){
  const ch=chordFor(deg,dir), v=voiceChord(ch);
  return {s,len,deg,dir,rootRel:ch.rootRel,suf:ch.suf,num:numeral(deg,ch,dir),notes:v.notes.map(n=>n-S.key),bass:v.bass==null?null:v.bass-S.key};
}
function seedDemo(){
  lastVoicing=null; const sx=S.sections;
  sx[0].bars=4; sx[0].chords=[mkEvent(0,'c',0,16),mkEvent(4,'c',16,16),mkEvent(5,'u',32,16),mkEvent(3,'r',48,16)]; sx[0].drums=pat6('pop');
  sx[1].bars=4; sx[1].chords=[mkEvent(5,'c',0,16),mkEvent(3,'u',16,16),mkEvent(0,'c',32,16),mkEvent(4,'d',48,8),mkEvent(4,'c',56,8)]; sx[1].drums=pat6('four');
  sx[2].bars=2; sx[2].chords=[mkEvent(1,'u',0,16),mkEvent(4,'u',16,16)]; sx[2].drums=pat6('half');
  sx[3].bars=4; sx[3].chords=[]; sx[3].drums=pat6('empty');
  lastVoicing=null;
}
const LS='tinebox.v1';
function load(){
  try{
    const raw=localStorage.getItem(LS); if(!raw) return null;
    const o=JSON.parse(raw); if(!o||!Array.isArray(o.sections)||o.sections.length!==4) return null;
    const d=defaults();
    return Object.assign(d,o,{snd:Object.assign(d.snd,o.snd),lv:Object.assign(d.lv,o.lv),tp:Object.assign(d.tp,o.tp)});
  }catch(e){ return null; }
}
function save(){ clearTimeout(save.t); save.t=setTimeout(saveNow,300); }
function saveNow(){
  for(let keep=S.takes?S.takes.length:0;;){
    try{ localStorage.setItem(LS,JSON.stringify(S)); return; }
    catch(e){
      const olds=(S.takes||[]).filter((k,i)=>i>=keep&&k.wave);
      if(keep<=0&&!olds.length){ toast('Storage is full. Clear old takes to keep saving.'); return; }
      keep=Math.max(0,keep-5); (S.takes||[]).forEach((k,i)=>{ if(i>=keep) delete k.wave; });
      if(keep===0) toast('Storage was full, so older take waveforms were removed.');
    }
  }
}

let S=null;
const R={playing:false,recArmed:false,cur:0,queued:null,dir:'c',absStep:0,secStep:0,chainPos:0,rep:0,nextTime:0,
  history:[],gate:null,voices:[],undo:[],cues:[],cueN:-1,zeroTime:null,slateTime:null,take:null,muteK:false,muteD:false,
  crashNext:false,openHat:null,disp:[],skipChord:null,skipDrum:new Set(),midi:null,midiOutId:'',wake:null,tone:null,
  laneSec:-1,heardSec:-1,gridCol:-1,peaks:[],meterHold:[0,0],clipAt:-10,
  palDir:'c',palSel:null,selEv:null,mcues:[],cap:null,markTime:null,chainOverride:null,loopOpen:false,loopMarked:false,tlSec:-1};
function activeChain(){ if(R.chainOverride) return R.chainOverride; if(R.take&&S.tp.takeMode==='jam') return null; return S.songMode&&S.chain.length?S.chain:null; }

/* ================= AUDIO ================= */
let ctx=null; const A={};
const stepDur=()=>60/S.bpm/4;
const lat=()=>ctx?((ctx.outputLatency||0)+(ctx.baseLatency||0)):0;
function initAudio(){
  if(ctx){ if(ctx.state!=='running') ctx.resume().catch(()=>{}); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ toast('This browser has no Web Audio.'); return; }
  ctx=new AC({latencyHint:'interactive'});
  const G=(v=1)=>{ const n=ctx.createGain(); n.gain.value=v; return n; };
  // keys chain
  A.keysIn=G(1);
  A.drive=ctx.createWaveShaper(); A.drive.oversample='2x';
  A.hp=ctx.createBiquadFilter(); A.hp.type='highpass'; A.hp.frequency.value=30;
  A.tone=ctx.createBiquadFilter(); A.tone.type='lowpass'; A.tone.Q.value=0.5;

  A.lfo=ctx.createOscillator(); A.lfo.frequency.value=4; A.lfoTrem=G(0); A.lfoPan=G(0);

  A.keysIn.connect(A.drive); A.drive.connect(A.hp); A.hp.connect(A.tone); A.tone.connect(A.trem); A.trem.connect(A.pan);
  A.chDry=G(1); A.chWet=G(0);
  const spl=ctx.createChannelSplitter(2), mer=ctx.createChannelMerger(2);
  A.dL=ctx.createDelay(0.05); A.dR=ctx.createDelay(0.05); A.dL.delayTime.value=0.012; A.dR.delayTime.value=0.018;
  const chLfo=ctx.createOscillator(); chLfo.frequency.value=0.7; const cl=G(0.0025), cr=G(-0.0025);
  chLfo.connect(cl); chLfo.connect(cr); cl.connect(A.dL.delayTime); cr.connect(A.dR.delayTime); chLfo.start();
  A.pan.connect(A.chDry); A.pan.connect(spl); spl.connect(A.dL,0); spl.connect(A.dR,1);
  A.dL.connect(mer,0,0); A.dR.connect(mer,0,1); mer.connect(A.chWet);
  A.keysOut=G(0.8); A.chDry.connect(A.keysOut); A.chWet.connect(A.keysOut);
  A.keysBus=G(1); A.drumsBus=G(1); A.keysOut.connect(A.keysBus);
  A.rev=ctx.createConvolver(); A.rev.buffer=makeIR(2.4); A.revSend=G(0.2);
  A.keysOut.connect(A.revSend); A.revSend.connect(A.rev); A.rev.connect(A.keysBus);
  A.dly=ctx.createDelay(2); A.dlySend=G(0.1); A.dlyFb=G(0.35); A.dlyLP=ctx.createBiquadFilter(); A.dlyLP.type='lowpass'; A.dlyLP.frequency.value=3500;
  A.keysOut.connect(A.dlySend); A.dlySend.connect(A.dly); A.dly.connect(A.dlyLP); A.dlyLP.connect(A.dlyFb); A.dlyFb.connect(A.dly); A.dlyLP.connect(A.keysBus);
  // drums chain
  A.drumsIn=G(0.32); A.drumLP=ctx.createBiquadFilter(); A.drumLP.type='lowpass'; A.drumsOut=G(0.75);
  A.drumsIn.connect(A.drumLP); A.drumLP.connect(A.drumsOut); A.drumsOut.connect(A.drumsBus);
  // routing: stereo mix or split (keys left, drums right)
  A.mixSel=G(1); A.splitSel=G(0);
  A.keysBus.connect(A.mixSel); A.drumsBus.connect(A.mixSel);
  const km=G(1), dm=G(1);

/* electric piano voice: two FM pairs, body (1:1) and tine (1:14) */
function epNote(midi,t,vel,relAt){
  const P=S.snd, f=440*Math.pow(2,(midi-69)/12);
  const out=ctx.createGain(); out.gain.value=0;
  const c1=ctx.createOscillator(), m1=ctx.createOscillator(), m1g=ctx.createGain();
  const c2=ctx.createOscillator(), m2=ctx.createOscillator(), m2g=ctx.createGain(), c2g=ctx.createGain();
  let tr=P.tineRatio; while(tr>1&&f*tr>ctx.sampleRate*0.42) tr--;
  c1.frequency.value=f; m1.frequency.value=f*P.bodyRatio; c2.frequency.value=f; c2.detune.value=3; m2.frequency.value=f*tr;
  c2g.gain.value=P.tineMix;
  m1.connect(m1g); m1g.connect(c1.frequency); m2.connect(m2g); m2g.connect(c2.frequency);
  c1.connect(out); c2.connect(c2g); c2g.connect(out); out.connect(A.keysIn);
  const hard=0.55+0.45*vel, bodyDev=P.body*hard*f*P.bodyRatio, tineDev=P.tine*hard*f*tr;
  m1g.gain.setValueAtTime(bodyDev,t); m1g.gain.setTargetAtTime(bodyDev*0.22,t+0.005,0.25+P.decay*0.1);
  m2g.gain.setValueAtTime(tineDev,t); m2g.gain.setTargetAtTime(0,t+0.002,0.035);
  const pf=clamp(Math.pow(2,(60-midi)/24),0.45,1.8), dec=P.decay*pf, peak=0.2*vel;
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(peak,t+0.003);
  out.gain.setTargetAtTime(peak*0.6,t+0.003,0.09); out.gain.setTargetAtTime(0,t+0.25,dec);
  const oscs=[c1,m1,c2,m2]; oscs.forEach(o=>o.start(t));
  const v={t,relAt:Infinity,stopAt:t+dec*7+0.3};
  oscs.forEach(o=>o.stop(v.stopAt));
  c1.onended=()=>{ try{ out.disconnect(); c2g.disconnect(); m1g.disconnect(); m2g.disconnect(); }catch(e){} const i=R.voices.indexOf(v); if(i>=0) R.voices.splice(i,1); };
  v.release=r=>{
    r=Math.max(r,t+0.02); if(r>=v.relAt) return; v.relAt=r;
    out.gain.cancelScheduledValues(r); out.gain.setTargetAtTime(0,r,P.release);
    const s=r+P.release*8; if(s<v.stopAt){ v.stopAt=s; oscs.forEach(o=>{ try{ o.stop(s); }catch(e){} }); }
  };
  R.voices.push(v); if(relAt!=null) v.release(relAt);
  while(R.voices.length>64){ const o=R.voices.shift(); o.release(ctx.currentTime); }
  return v;
}

  notes.forEach((n,i)=>vs.push(epNote(n,style==='strum'?t+i*0.024:t,vel*(0.92+Math.random()*0.08),relAt)));

}

  const K=KITS[S.kit], out=A.drumsIn, G=()=>{ const g=ctx.createGain(); g.gain.value=0; return g; };
  if(i===0){
    const o=ctx.createOscillator(), g=G(); o.frequency.setValueAtTime(K.kHi,t); o.frequency.exponentialRampToValueAtTime(K.kLo,t+K.kSw);

/* ================= SEQUENCER ================= */
function pushHist(h){ R.history.push(h); if(R.history.length>128) R.history.shift(); }
function histAt(time){ const H=R.history; for(let k=H.length-1;k>=0;k--) if(H[k].time<=time) return H[k]; return null; }
function posAt(time){ const h=histAt(time); if(!h||h.sec==null) return null; return {abs:h.abs+clamp((time-h.time)/h.dur,0,1.5),h}; }

function scheduler(){
  if(!ctx||ctx.state!=='running') return;
  if(R.mon&&R.playing){ const m=R.nextTime-ctx.currentTime; if(m<R.mon.min) R.mon.min=m; R.mon.n++; }
  if(R.nextTime<ctx.currentTime-0.25){ R.nextTime=ctx.currentTime+0.02; if(R.mon) R.mon.resets++; }
  const ahead=ctx.currentTime+0.12;
  while(R.nextTime<ahead){ scheduleStep(R.nextTime); R.nextTime+=stepDur(); }
}
function scheduleStep(t){
  const dur=stepDur(); let tt=t;
  if(midiReady()){
    if(R.playing&&R.take&&R.absStep===0&&R.take.startMode){ if(S.tp.clock) midiSend([0xF2,0,0],t-0.03); tapeStart(R.take.startMode,t); }
    if(S.tp.clock&&!R.clockMute) for(let i=0;i<6;i++) midiSend([0xF8],t+i*dur/6);
  }
  if(R.playing){
    const abs=R.absStep;
    if(((abs%2)+2)%2===1) tt=t+(S.swing/100)*dur/3;
    if(abs<0){
      pushHist({time:t,dur,abs,sec:null,secStep:-1});
      if(R.take&&abs===-16&&(S.tp.slate||S.tp.countIn)) R.markTime=t;
      if(R.take&&S.tp.slate&&abs===-16) slate(t);
      else if(R.take&&S.tp.countIn&&abs>=-16&&abs%4===0) click(t,abs===-16);
    } else {
      if(abs===0){ R.zeroTime=t; logCue(R.cur,t); passStart(t); }
      if(R.take&&abs%16===0) barCue(abs/16,t);
      const sec=S.sections[R.cur], p=R.secStep;
      pushHist({time:t,dur,abs,sec:R.cur,secStep:p});
      if(p%16===0) R.crashNext=false;
      const ses=tplSes(); if(!TPL.t2rec&&!ses) drumStep(sec,p,tt,abs);
      if(tplMetroOn()&&p%4===0&&!TPL.t2rec) click(tt,p%16===0);
      if(LP.buf&&!LP.rec&&!S.looper.muted&&((abs-LP.phase)%LP.steps+LP.steps)%LP.steps===0) lpPlay(t);
      const ev=sec.chords.find(e=>e.s===p);
      if(ev&&!TPL.t2rec&&!TPL.keyHold&&!ses){
        if(R.skipChord===abs) R.skipChord=null;
        else if(!(R.recArmed&&R.gate&&R.gate.live&&R.gate.held)) startSeqGate(ev,tt,dur);
      }
      R.secStep++;
      if(R.secStep%16===0) advance(t+dur);
    }
    if(R.playing) R.absStep++;
  }
  tickGate(tt,dur);
}
function willChange(barStart){
  const len=S.sections[R.cur].bars*16, lastBar=barStart+16>=len;
  const ch=activeChain();
  if(ch){ if(!lastBar) return false; const it=ch[R.chainPos]; return !!it&&R.rep+1>=it.rep&&R.chainPos+1<ch.length; }
  return R.queued!==null&&(S.switchAt==='bar'||lastBar);
}
function drumStep(sec,p,t,abs){
  const s=p%16;
  if(S.autoFill&&s>=12&&willChange(p-s)){
    if(!R.muteD){ if(s===12) drum(0,t,0.9); drum(1,t,0.45+(s-12)*0.18); }
    R.crashNext=true; return;
  }
  for(let i=0;i<6;i++){
    const v=sec.drums[i][s]; if(!v) continue;
    const key=abs+':'+i; if(R.skipDrum.has(key)){ R.skipDrum.delete(key); continue; }
    drum(i,t,v===2?1:0.72);
  }
}
function advance(tNext){
  const len=S.sections[R.cur].bars*16, loopEnd=R.secStep>=len, ch=activeChain();
  if(loopEnd) passEnd(tNext);
  if(ch){
    if(!loopEnd) return;
    R.secStep=0; R.rep++;
    const it=ch[R.chainPos];
    if(!it||R.rep>=it.rep){
      R.rep=0; R.chainPos++;
      if(R.chainPos>=ch.length){
        if(S.songEnd==='loop'&&!R.take) R.chainPos=0;
        else { endSong(tNext); return; }
      }
      setSection(ch[R.chainPos].sec,tNext);
    } else passStart(tNext);
  } else if(R.queued!==null&&(S.switchAt==='bar'||loopEnd)){ const q=R.queued; R.queued=null; setSection(q,tNext); }
  else if(loopEnd){ R.secStep=0; passStart(tNext); }
}
function setSection(i,t){

/* MIDI to TP-7 during takes: cue rec mode (CC 16) + one note per cue, loop in/out (CC 17) */
function logCue(i,t){ R.cues.push({sec:i,name:S.sections[i].name,t,note:null}); }
/* one TP-7 cue per section start, or per N bars; notes 36..127 give up to 92 cues per take */
const inTakeCues=()=>S.tp.midiCue&&S.tp.startMode!=='sysex';
function barCue(bar,t){
  if(!(inTakeCues()&&midiReady())) return;

function passStart(t){ if(R.take&&S.tp.midiLoop===R.cur&&!R.loopMarked&&!R.loopOpen){ midiSend([0xB0,17,1],t); R.loopOpen=true; } }

/* gates: one chord sounds at a time, live or sequenced */
function startGate(g,t){
  const p=R.gate;
  if(p){ if(p.rec) commitRec(p,t); endGateVoices(p,t); }
  g.start=t; g.idx=0; g.voices=[]; g.style=S.style; R.gate=g;
  if(g.style==='hold'||g.style==='strum') g.voices=playChord(g.notes,g.bass,t,g.style,g.end,0.8);
  else if(g.live) fireGateStep(g,t,stepDur());

  R.disp.push({name:g.name,num:g.num,at:t}); R.disp.sort((a,b)=>a.at-b.at); if(R.disp.length>12) R.disp.shift();
}
function endGateVoices(g,t){ g.voices.forEach(v=>v.release(t)); g.voices=[]; if(g.end==null||t<g.end) g.end=t; g.held=false; }
function fireGateStep(g,t,dur){
  const i=g.idx++;
  if(i===0&&g.bass!=null) g.voices.push(epNote(g.bass,t,0.78,g.end));
  if(g.style==='pulse'){ if(i%2===0) playChord(g.notes,null,t,'hold',t+dur*1.6,i%8===0?0.86:0.7); }
  else {

    epNote(g.arp[i%g.arp.length],t,i%4===0?0.82:0.68,t+dur*0.92);
  }
}
function tickGate(t,dur){
  const g=R.gate; if(!g||(g.style!=='pulse'&&g.style!=='arp')) return;
  if(g.end!=null&&t>=g.end-0.002) return;
  if(g.live){ if(t<g.start+0.03) return; } else if(t<g.start-0.002) return;
  fireGateStep(g,t,dur);
}
function startSeqGate(ev,t,dur){
  startGate({live:false,held:false,notes:ev.notes.map(n=>n+S.key),bass:ev.bass==null?null:ev.bass+S.key,end:t+ev.len*dur,
    name:NOTE[(S.key+ev.rootRel)%12]+ev.suf,num:ev.num},t);

/* a new chord trims whatever it overlaps instead of deleting it */
function insertEvent(sec,ev){
  const a=ev.s, b=ev.s+ev.len, out=[];
  for(const e of sec.chords){
    if(e===ev) continue;
    const ea=e.s, eb=e.s+e.len;
    if(eb<=a||ea>=b){ out.push(e); continue; }
    if(ea<a){ if(eb>b) out.push(Object.assign({},e,{s:b,len:eb-b,notes:e.notes.slice()})); e.len=a-ea; out.push(e); continue; }
    if(eb>b){ e.len=eb-b; e.s=b; out.push(e); }
  }
  out.push(ev); out.sort((x,y)=>x.s-y.s); sec.chords=out;

/* live playing and recording */
function keyDown(deg){
  initAudio(); if(!ctx) return;
  const dir=R.dir, ch=chordFor(deg,dir), v=voiceChord(ch), t=ctx.currentTime+0.004;
  const g={live:true,held:true,keyId:deg,dir,notes:v.notes,bass:v.bass,end:null,name:chName(ch),num:numeral(deg,ch,dir),rootRel:ch.rootRel,suf:ch.suf};
  startGate(g,t);
  if(R.playing&&R.recArmed) beginRec(g,t);
}
function keyUp(deg){
  const g=R.gate; if(!ctx||!g||!g.live||!g.held||g.keyId!==deg) return;
  const t=ctx.currentTime+0.004; if(g.rec) commitRec(g,t); endGateVoices(g,t);
}
function beginRec(g,t){
  const p=posAt(t-lat()); if(!p) return;
  const q=S.quant, qa=Math.round(p.abs/q)*q, L=S.sections[p.h.sec].bars*16;
  let s=p.h.secStep+(qa-p.h.abs); s=((s%L)+L)%L;
  g.rec={sec:p.h.sec,s,abs:qa};
}
function commitRec(g,t){
  const r=g.rec; g.rec=null; if(!r) return;
  const q=S.quant, p=posAt(t-lat()), endAbs=p?Math.round(p.abs/q)*q:r.abs+q;
  const sec=S.sections[r.sec], L=sec.bars*16;
  const len=Math.min(Math.max(q,endAbs-r.abs),L-r.s);
  pushUndo(r.sec);
  insertEvent(sec,{s:r.s,len,deg:g.keyId,dir:g.dir,rootRel:g.rootRel,suf:g.suf,num:g.num,notes:g.notes.map(n=>n-S.key),bass:g.bass==null?null:g.bass-S.key});
  if(r.abs>=R.absStep) R.skipChord=r.abs;
  save(); renderSecs(); if(R.laneSec===r.sec) renderLane(r.sec); renderTL();
}
function padHit(i){
  initAudio(); if(!ctx) return;
  const t=ctx.currentTime+0.003; drum(i,t,0.9);
  if(!(R.playing&&R.recArmed)) return;
  const p=posAt(t-lat()); if(!p) return;
  const qa=Math.round(p.abs), sec=S.sections[p.h.sec], L=sec.bars*16;
  let s=p.h.secStep+(qa-p.h.abs); s=(((s%L)+L)%L)%16;
  pushUndo(p.h.sec,'pad');
  if(!sec.drums[i][s]) sec.drums[i][s]=1;
  if(qa>=R.absStep) R.skipDrum.add(qa+':'+i);
  save(); if(p.h.sec===R.cur) renderGrid(); renderSecs();
}

/* transport */

  setTimeout(()=>{ tapeStop(m); midiSend([0xB0,14,0]); st.textContent='Test done. Did the TP-7 record about 4 s? If not, try another method.'; },5000);
}

/* undo and edits */
function pushUndo(i,tag){
  const last=R.undo[R.undo.length-1], now=Date.now();
  if(tag&&last&&last.i===i&&last.tag===tag&&now-last.at<3000){ last.at=now; return; }
  const s=S.sections[i]; R.undo.push({i,tag,at:now,d:JSON.stringify({chords:s.chords,drums:s.drums,bars:s.bars})});
  if(R.undo.length>40) R.undo.shift();
}
function undo(){
  const u=R.undo.pop(); if(!u){ toast('Nothing to undo.'); return; }
  Object.assign(S.sections[u.i],JSON.parse(u.d)); R.selEv=null; save(); renderSecs(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderGrid(); renderTL();
  toast(`Undid the last change in ${LETTERS[u.i]}.`);
}
function setBars(i,b){
  const s=S.sections[i]; if(s.bars===b) return; pushUndo(i);
  s.bars=b; s.chords=s.chords.filter(e=>e.s<b*16).map(e=>Object.assign({},e,{len:Math.min(e.len,b*16-e.s)}));
  if(R.playing&&R.cur===i&&R.secStep>=b*16) R.secStep=R.secStep%16;
  save(); renderSecs(); renderSecEdit(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderChainMeta(); renderTL(); renderTpInfo();
}
function copySec(i,j){
  pushUndo(j); const a=S.sections[i], b=S.sections[j];
  b.bars=a.bars; b.chords=JSON.parse(JSON.stringify(a.chords)); b.drums=JSON.parse(JSON.stringify(a.drums));
  save(); renderSecs(); renderSecEdit(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderGrid(); renderTL(); renderChainMeta();
  toast(`Copied ${LETTERS[i]} to ${LETTERS[j]}.`);
}
function confirmTap(el,label,fn){
  if(el.dataset.armed){ delete el.dataset.armed; el.textContent=el.dataset.orig; fn(); return; }
  el.dataset.armed='1'; el.dataset.orig=el.textContent; el.textContent=label;
  setTimeout(()=>{ if(el.dataset.armed){ delete el.dataset.armed; el.textContent=el.dataset.orig; } },2500);
}
function setBpm(v,exact){ S.bpm=clamp(exact?Math.round(v*10)/10:Math.round(v),50,200); applySound(); save(); syncControls(); renderInfo(); renderChainMeta(); }
let taps=[];
function tapTempo(){
  const n=performance.now();
  if(taps.length&&n-taps[taps.length-1]>2000) taps=[];
  taps.push(n); if(taps.length>8) taps.shift();
  if(taps.length>=3){ const iv=[]; for(let k=1;k<taps.length;k++) iv.push(taps[k]-taps[k-1]); iv.sort((a,b)=>a-b); setBpm(60000/iv[iv.length>>1]); }
  tapFeedback();
}
function tapFeedback(){
  const need=Math.max(0,3-taps.length);
  $$('.tapout').forEach(b=>{ b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); const l=b.querySelector('small'); if(l) l.textContent=need?`tap ${need} more`:'set'; });
  clearTimeout(tapFeedback.t); tapFeedback.t=setTimeout(()=>$$('.tapout small').forEach(l=>l.textContent='bpm'),2000);
}

const CAP_RATE=50;

  if(!ctx) return;

    A.cap=ctx.createScriptProcessor(1024,2,1); A.capSink=ctx.createGain(); A.capSink.gain.value=0;
    A.cap.connect(A.capSink); A.capSink.connect(ctx.destination);
    A.cap.onaudioprocess=e=>{
      const c=R.cap; if(!c) return; if(c.t0==null) c.t0=e.playbackTime;
      const ib=e.inputBuffer, L=ib.getChannelData(0), Rr=ib.numberOfChannels>1?ib.getChannelData(1):L;
      for(let i=0;i<L.length;i++){ const a=Math.abs(L[i]), b=Math.abs(Rr[i]), m=a>b?a:b; if(m>c.acc) c.acc=m; if(++c.cnt>=c.per){ c.pk.push(c.acc); c.acc=0; c.cnt=0; } }
    };
  }
  try{ A.out.disconnect(A.cap); }catch(e){}
  A.out.connect(A.cap);
  R.cap={t0:null,acc:0,cnt:0,per:Math.round(ctx.sampleRate/CAP_RATE),pk:[]};
}
function stopCapture(k,z,mark){
  const c=R.cap; R.cap=null; try{ A.out.disconnect(A.cap); }catch(e){}
  if(!k||!c||c.t0==null||!c.pk.length||z==null) return;
  let t0=c.t0;
  // line the envelope up on the first known sound: the start beep or the first count-in click
  if(mark!=null){
    const from=Math.max(0,Math.floor((mark-t0-0.3)*CAP_RATE));
    for(let i=from;i<c.pk.length&&i<from+40;i++){ if(c.pk[i]>0.05){ const corr=t0+(i+0.5)/CAP_RATE-mark; if(corr>-0.2&&corr<0.3) t0-=corr; break; } }

/* SysEx map (23 Oct). The TP-7 speaks Teenage Engineering's shared SysEx framework, documented for the EP-133 by
   kmorrill/ep-series-sysex: F0 00 20 76 <product> 40 <flags|id-high> <id-low> <command> <packed7 payload> F7, flags 0x40 =
   request, 0x20 = id present. Responses put a raw status byte before the payload; a nonzero status carries an ASCII reason.
   Byte 5 = 0x33 marks a firmware debug frame. Known commands: 0x01 GREET, 0x02 ECHO, 0x04 USB mode (MTP) and 0x7F transport.
   The EP-133's 0x05 FILE returns status 2 (unknown) on the TP-7 (24 Oct), so there is no file access over SysEx. */
function pack7(v){ const o=[]; for(let i=0;i<v.length;i+=7){ const g=v.slice(i,i+7); let m=0; g.forEach((x,j)=>{ if(x&0x80) m|=1<<j; }); o.push(m,...g.map(x=>x&0x7F)); } return o; }
function sxReq(cmd,payload){ sxId=sxId%4095+1; sxSent[sxId]=cmd===0x7F&&payload&&payload.length?payload[0]:'cmd '+hx([cmd]); return {id:sxId,bytes:[0xF0,0x00,0x20,0x76,0x19,0x40,0x60|((sxId>>7)&0x1F),sxId&0x7F,cmd,...pack7(payload||[]),0xF7]}; }
const asc=v=>String.fromCharCode(...v.filter(x=>x>=32&&x<127));
function sxParse(d){ d=[...d]; if(d[0]!==0xF0||d.length<9||d[1]!==0||d[2]!==0x20||d[3]!==0x76) return null;
  if(d[5]===0x33) return {debug:true,text:asc(d.slice(6,-1))};
  if(d[4]!==0x19||d[5]!==0x40) return null;
  const fl=d[6], id=((fl&0x1F)<<7)|d[7], cmd=d[8];
  if(fl&0x40) return {kind:'event',id,cmd,v:sx7(d.slice(9,-1))};
  const st=d[9]??0, v=sx7(d.slice(10,-1)); return {kind:'resp',id,cmd,st,v,reason:st?asc(v):''};

async function sxAsk(cmd,payload,ms){

// - Two section changes could run at once (a second press while the first was still moving the tape).
// - Tap tempo never worked again after the first song, and switch 1 could not start a new song.
// - Keyboard mode: with a menu or slider focused, the arrow keys changed it instead of reaching the looper.
// Fixes: every looper MIDI message is tagged and a stop cancels the queued ones; each stop advances TPL.gen and every running step
// checks it after each wait; the moves that cannot be cut short (making a recording, clearing, printing) finish and then stay stopped;
// a section change marks the looper busy ('cue'); record taps queue behind each other; a record tap during the change-over is kept.

// --- the footswitch log: every press, what it did, what the looper and the TP-7 reported. Kept across reloads (last 400 events).
function pedLog(k,txt){ try{ const L=(S.pedLog=S.pedLog||[]); L.push([Math.round(performance.now()),k,String(txt).slice(0,220)]); if(L.length>400) L.splice(0,L.length-400); PED.logDirty=true; }catch(e){} }
function pedLogText(n){ const L=(S.pedLog||[]).slice(-(n||400)); let t0=null; const out=[];
  let prev=null; L.forEach(([t,k,x])=>{ if(k==='app'){ t0=t; prev=t; out.push(`— ${x}`); return; } if(t0==null||(prev!=null&&t<prev-1000)){ t0=t; if(prev!=null) out.push('— (page loaded)'); } prev=t; out.push(`  +${((t-t0)/1000).toFixed(2).padStart(7)} s  ${k.padEnd(5)} ${x}`); }); return out.join('\n'); }
setInterval(()=>{ if(PED.logDirty){ PED.logDirty=false; save(); } },4000);
window.addEventListener('pagehide',()=>{ if(PED.logDirty){ PED.logDirty=false; try{ saveNow(); }catch(e){} } });
// what the looper does, as it changes
setInterval(()=>{ const k=TPL.st+(TPL.armed?(TPL.arming===1?' + recording Tinebox':' + recording'):'')+(TPL.armTimer?' (arm pending)':''); if(k!==PED.stK){ if(PED.stK!=null) pedLog('st',`looper: ${k}`); PED.stK=k; } },100);

// --- the TP-7's own reports: it announces playing = 0/1 and armed = 0/1 (SysEx 0x7F 0x4E / 0x4F)
function sxNotice(d){ if(d.length<12||d[5]!==0x40||(d[6]&0x60)!==0x40||d[8]!==0x7F) return null; const v=sx7(d.slice(9,-1)); return v[0]===0x4E?{k:'playing',v:v[1]}:v[0]===0x4F?{k:'armed',v:v[1]}:null; }
function tpNotice(n,now){ const key=n.k==='armed'?'tpArm':'tpPlay', o=R[key]; R[key]={v:n.v,t:now}; (R.tpNotes=R.tpNotes||[]).push([now,n.k,n.v]); if(R.tpNotes.length>300) R.tpNotes.shift(); if(!o||o.v!==n.v) pedLog('tp',`TP-7 says ${n.k} = ${n.v}`); }

// --- looper MIDI goes through one queue with a tag, so a stop can take back what is still waiting
const tplSend=(b,t)=>midiSend(b,t,'tpl');
function tplPurge(){ const q=R.mq; if(!q) return 0; let n=0; for(let i=q.length-1;i>=0;i--) if(q[i].tag==='tpl'){ q.splice(i,1); n++; } if(n) pedLog('st',`${n} scheduled looper message${n>1?'s':''} cancelled`); return n; }

// --- record taps (switch 1 and 5) run one after another: a tap that comes while the last one is still landing waits its turn
async function tplRecToggle(which){
  if(TPL.toggling){ (TPL.toggleQ=TPL.toggleQ||[]).push(which); pedLog('st',`record ${which?'Tinebox':'guitar'} waits for the last tap to land`); return; }
  const G=TPL.gen; TPL.toggling=true; try{ await tplRecToggle0(which); } finally{ TPL.toggling=false; }
  if(G!==TPL.gen){ TPL.toggleQ=[]; return; } const q=TPL.toggleQ||[]; if(q.length) return tplRecToggle(q.shift()); }

// --- the looper's actions, shared by the footswitch and the TP-7 tab
async function tplAct(a,el){
  if(a==='tplKeySet'&&el){ const [t,m]=el.dataset.v.split(':'); tplKeyTo(+t,m); if(TPL.key&&TPL.key.st==='done') TPL.key.st='kept'; tplKeyRender(); return; }
  if(a==='tplAutoKey'){ S.tp.autoKey=S.tp.autoKey===false; save(); tplKeyRender(); return; }
  if(R.dgBusy&&!R.pedLive){ toast('A diagnostics test is running.'); return; } if(R.take){ toast('A take is running.'); return; }
  TPL.dg=null; tplLoad(); if(TPL.owner==='test'&&!R.pedLive){ Object.assign(TPL,{regions:[],st:'idle',owner:null,loop:null,rec:null,cur:0,key:null,session:false}); S.tplSave=null; save(); }
  const st=TPL.st; try{ await tplAct2(a,el,st); }catch(err){ pedLog('err',`${a}: ${err&&err.message||err}`); tplSay('Error: '+(err&&err.message||err)); }
  tplRender(); }
const TPL_STOPLATER=['new','clear','print','prep'], TPL_CUTSHORT=['closing','gap','cue','next'];
async function tplAct2(a,el,st){
