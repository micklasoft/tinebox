<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tinebox">
<title>Tinebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --body:#D3D6D1; --body-2:#C4C8C2; --panel:#E3E5E0; --line:#AAB0A9; --key:#FBFAF5; --key-edge:#9CA29B; --key-down:#E8E7E0;
  --ink:#1D2327; --ink-2:#555D62; --screen:#000; --scr-ink:#DDF1FF; --scr-dim:#6D8897;
  --rec:#D5362B; --go:#2E66D6; --sa:#DDA12A; --sb:#3A9B72; --sc:#6A84D8; --sd:#C064A8; --focus:#2E66D6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --body:#24282A; --body-2:#1B1E20; --panel:#2C3133; --line:#434A4D; --key:#3A4043; --key-edge:#111415; --key-down:#31363A; --ink:#E7EAE5; --ink-2:#A0A7A2; --scr-dim:#5D7888; color-scheme:dark; }
}
:root[data-theme="dark"]{ --body:#24282A; --body-2:#1B1E20; --panel:#2C3133; --line:#434A4D; --key:#3A4043; --key-edge:#111415; --key-down:#31363A; --ink:#E7EAE5; --ink-2:#A0A7A2; --scr-dim:#5D7888; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;color:var(--ink);background-color:var(--body);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
  font-family:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:15px;line-height:1.3;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink)}
input,textarea{-webkit-user-select:text;user-select:text}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;padding:8px 10px 0}
.deck{display:flex;flex-direction:column;gap:8px;flex:none}
.work{display:flex;flex-direction:column;min-height:0;flex:1}
.panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 2px 20px;-webkit-overflow-scrolling:touch}
@media (min-width:900px){ #app{max-width:1120px;flex-direction:row;padding:16px;gap:20px} .deck{width:400px} .work{flex:1} }

/* screen */
.screen{position:relative;background:var(--screen);color:var(--scr-ink);border-radius:12px;padding:10px 28px 10px 12px;
  box-shadow:inset 0 0 0 3px #2B3034,0 1px 0 rgba(255,255,255,.45)}
.scr-row{display:flex;gap:12px;font-size:14px;color:var(--scr-dim);white-space:nowrap;overflow:hidden}
.scr-row span:first-child{color:var(--scr-ink)}
.take-dot{color:#ff6a5e!important}
.scr-main{display:flex;align-items:baseline;gap:12px;min-height:54px;padding-top:4px}
.dot{font-family:'Doto',ui-monospace,monospace;font-weight:900}
#sChord{font-size:44px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%}
.scr-num{font-size:18px;color:var(--scr-dim)}
.lane{position:relative;height:26px;margin-top:8px;border-radius:4px;background:#0C1013;overflow:hidden}
.bl{position:absolute;top:0;bottom:0;width:1px;background:#2A3137}
.blk{position:absolute;top:3px;bottom:3px;background:var(--c);color:#000;font-size:12px;font-weight:700;padding:0 4px;border-radius:3px;white-space:nowrap;overflow:hidden;line-height:20px;box-shadow:inset -1px 0 0 #000}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--scr-ink);left:0}
.meter{position:absolute;right:9px;top:10px;bottom:10px;display:flex;gap:3px}
.meter i{display:block;width:5px;border-radius:2px;background:#1A2025;position:relative;overflow:hidden}
.meter b{position:absolute;inset:0;background:linear-gradient(to top,#39C07A 0 72%,#E8C33A 72% 90%,#E5483B 90%);clip-path:inset(100% 0 0 0)}
.meter.clip i{box-shadow:0 0 0 1px #E5483B}
.count{position:absolute;inset:0;background:rgba(0,0,0,.94);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:10px}
#countN{font-size:64px;line-height:1}
#countT{font-size:16px;color:var(--scr-ink)}
#countS{font-size:14px;color:var(--scr-dim)}

/* transport */
.transport{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:6px}
.tb{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--key);box-shadow:0 2px 0 var(--key-edge);
  font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px}
.tb:active{transform:translateY(2px);box-shadow:none}
.tb.play[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.tb .rd{width:11px;height:11px;border-radius:50%;background:var(--rec)}
.tb.rec[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.tb.rec[aria-pressed="true"] .rd{background:#fff}
.tb.tog[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}

/* sections */
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sec{position:relative;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:9px 6px 6px;text-align:left;
  display:grid;grid-template-columns:auto 1fr;column-gap:5px;align-items:baseline;overflow:hidden;min-height:56px}
.sec::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.sec b{font-size:20px;line-height:1}
.sec span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec small{grid-column:1/-1;font-size:12px;color:var(--ink-2);margin-top:3px}
.sec.cur{background:color-mix(in srgb,var(--c) 30%,var(--panel));border-color:var(--c)}
.sec.q{outline:2px dashed var(--c);outline-offset:-3px;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:color-mix(in srgb,var(--c) 45%,var(--panel))}}
@media (prefers-reduced-motion:reduce){.sec.q{animation:none}}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 0 8px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* shared controls */
h3{font-size:17px;font-weight:700;margin:20px 0 6px}
.pnl > h3:first-child{margin-top:4px}
.seg{display:flex;flex-wrap:wrap;background:var(--body-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:7px;padding:7px 5px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--key);color:var(--ink);box-shadow:0 1px 0 var(--key-edge)}
.orow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.orow .seg{flex:1 1 auto}
.lbl{font-size:14px;color:var(--ink-2);min-width:88px}
.tog,.btn{border:1px solid var(--line);background:var(--key);border-radius:8px;padding:7px 11px;font-weight:600;font-size:14px;box-shadow:0 2px 0 var(--key-edge)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}
.btn:active,.tog:active{transform:translateY(2px);box-shadow:none}
.btn.sm{padding:4px 9px}
.btn.danger{color:var(--rec)}
select{border:1px solid var(--line);background:var(--key);border-radius:8px;padding:6px 8px;max-width:100%}
.rng{display:grid;grid-template-columns:72px 1fr 62px;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.rng output{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:14px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.note,.hint,.status{font-size:14px;color:var(--ink-2);line-height:1.4;max-width:62ch;margin:6px 0}
.hint{text-align:center;margin-top:12px}
.status{color:var(--ink)}

/* play */
.play-top{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.stick{position:relative;width:150px;height:150px;border-radius:50%;border:1px solid var(--line);touch-action:none;
  background:radial-gradient(circle at 50% 50%,var(--body-2) 0 30%,var(--panel) 31% 100%)}
.sl{position:absolute;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:var(--ink-2);pointer-events:none;white-space:nowrap}
.sl.on{color:var(--go)}
.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--key);
  box-shadow:0 3px 0 var(--key-edge),inset 0 -5px 8px rgba(0,0,0,.08);transition:transform .12s ease-out;pointer-events:none}
.stick.drag .knob{transition:none}
.play-opts{display:flex;flex-direction:column;gap:8px;min-width:0}
.play-opts .orow{margin:0}
.play-opts .seg{flex-wrap:nowrap}
.oct{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.oct output{min-width:26px;text-align:center;color:var(--ink);font-weight:700}
.keys{margin-top:14px;display:flex;flex-direction:column;gap:9px;touch-action:none}
.krow{display:grid;gap:8px}
.krow.top{grid-template-columns:repeat(3,1fr);padding:0 11%}
.krow.bot{grid-template-columns:repeat(4,1fr)}
.key{border:1px solid var(--line);background:var(--key);border-radius:12px 12px 16px 16px;box-shadow:0 4px 0 var(--key-edge);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 3px 10px;touch-action:none;min-width:0}
.krow.top .key{height:clamp(56px,9vh,78px)}
.krow.bot .key{height:clamp(78px,13.5vh,116px)}
.key .kn{font-size:22px;font-weight:700;line-height:1}
.key .kc{font-size:14px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;max-width:100%}
.key.down{transform:translateY(4px);box-shadow:none;background:var(--key-down)}

/* drums */
.grid{display:grid;grid-template-columns:40px repeat(16,1fr);gap:3px 2px;align-items:center}
.gl{font-size:13px;font-weight:600;color:var(--ink-2)}
.cell{aspect-ratio:3/4;border:0;border-radius:3px;background:var(--key);box-shadow:inset 0 0 0 1px var(--line);padding:0;min-width:0}
.cell.alt{background:var(--body-2)}
.cell.on{background:var(--ink);box-shadow:none}
.cell.acc{background:var(--go);box-shadow:none}
.cell.now{outline:2px solid var(--rec);outline-offset:-1px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;touch-action:none}
.pad{height:64px;border-radius:10px;border:1px solid var(--line);background:var(--key);box-shadow:0 3px 0 var(--key-edge);font-weight:600;font-size:15px}
.pad.hit{transform:translateY(3px);box-shadow:none;background:var(--key-down)}

/* song */
.se{padding:9px 0;border-top:1px solid var(--line)}
.se-head{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.se-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;padding-left:36px}
.se-ctl .seg{flex:0 0 auto}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--c);color:#000;font-weight:700;flex:none}
input.nm{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--key);width:100%}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.chain .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chain output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.chain li.empty{color:var(--ink-2);font-size:14px}
.chain li.now{background:color-mix(in srgb,var(--c) 22%,transparent)}
#chainAdd .btn{border-top:4px solid var(--c)}

/* tp-7 */
.take{width:100%;height:54px;border-radius:12px;border:0;background:var(--rec);color:#fff;font-size:18px;font-weight:700;margin-top:10px;box-shadow:0 3px 0 #8E2019}
.take:active{transform:translateY(3px);box-shadow:none}
.take.live{background:var(--ink);color:var(--body);box-shadow:0 3px 0 #000}
.cues{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.cues li{display:grid;grid-template-columns:78px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.cues small{color:var(--ink-2)}
.cues li.empty{display:block;color:var(--ink-2);font-size:14px}
textarea{width:100%;height:140px;border-radius:8px;border:1px solid var(--line);background:var(--key);padding:8px;font-size:14px}
#peakOut{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}

/* chords editor */
.pal{position:sticky;top:-10px;z-index:3;background:var(--body);padding:8px 0 6px;margin-top:-8px}
.pal-keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ptile{height:56px;border:1px solid var(--line);background:var(--key);border-radius:9px;box-shadow:0 3px 0 var(--key-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px;touch-action:none;min-width:0}
.ptile b{font-size:16px;line-height:1;white-space:nowrap}
.ptile span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.01em}
.ptile.sel{background:var(--ink);border-color:var(--ink);color:var(--body)}
.ptile.sel span{color:var(--body)}
.pal-shape{margin-top:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pal-shape::-webkit-scrollbar{display:none}
.pal-shape button{flex:1 0 auto;padding:6px 6px}
.tl{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.trow{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center}
.tbar{font-size:13px;font-weight:700;color:var(--ink-2);text-align:right}
.tg{position:relative;height:50px;border-radius:7px;background-color:var(--panel);box-shadow:inset 0 0 0 1px var(--line);
  background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 100%}
.tg.fine{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-size:25% 100%,12.5% 100%}
.tblk{position:absolute;top:4px;bottom:4px;background:color-mix(in srgb,var(--c) 78%,var(--key));border:1px solid color-mix(in srgb,var(--c) 55%,#000);border-radius:6px;color:#000;padding:2px 5px;overflow:hidden;white-space:nowrap;touch-action:none;display:flex;flex-direction:column;justify-content:center}
.tblk b{font-size:15px;line-height:1.1}
.tblk small{font-size:11px;opacity:.7}
.tblk.cont{border-left-style:dashed;border-top-left-radius:0;border-bottom-left-radius:0}
.tblk.more{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
.tblk.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.tprev{position:absolute;top:4px;bottom:4px;border-radius:6px;border:2px dashed var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);pointer-events:none;z-index:2}
.tph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rec);pointer-events:none;z-index:2}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;margin:-58px 0 0 -32px;min-width:64px;padding:8px 10px;border-radius:9px;background:var(--ink);color:var(--body);font-weight:700;font-size:16px;text-align:center}
.selbar{border-top:1px solid var(--line);padding:8px 0 2px;margin-top:8px}
.selbar .note{margin:4px 0 0}
.selinfo{font-weight:700;font-size:16px}
.selbar .orow{margin:6px 0 0}

/* take card, checklist, takes log */
.takecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin-top:2px}
.tk-state{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tk-state.rec{color:var(--rec)}
.tk-small{font-size:15px;margin-top:3px;min-height:20px}
.tk-sum{font-size:14px;color:var(--ink-2);margin-top:6px}
.takecard .take{margin-top:10px}
.take:disabled{opacity:.55}
h3 small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:6px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.ckbox{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--key);font-weight:700;font-size:16px;color:transparent;padding:0;line-height:1}
.chk li.on .ckbox{background:var(--sb);border-color:var(--sb);color:#fff}
.chk p{margin:3px 0 0;font-size:15px;line-height:1.35}
.chk li.on p{color:var(--ink-2)}
.chk .opt{font-size:12px;font-weight:700;color:var(--ink-2);margin-right:4px}
.chk .orow{margin:8px 0 0}
.takes{list-style:none;margin:0;padding:0}
.takes > li{border-top:1px solid var(--line);padding:8px 0}
.takes summary{cursor:pointer;font-size:15px}
.takes summary b{margin-right:6px}
.takes ol{list-style:none;margin:6px 0 0;padding:0;font-variant-numeric:tabular-nums;font-size:14px}
.takes ol li{display:grid;grid-template-columns:72px 1fr auto;gap:8px;padding:3px 0}
.takes ol small{color:var(--ink-2)}
.takes li.empty{color:var(--ink-2);font-size:14px;border-top:0}
details.more{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
details.more > summary{font-weight:700;font-size:16px;padding:8px 0;cursor:pointer}

/* take review */
.tk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
.tk-row b{margin-right:4px}
canvas.mini{display:block;width:100%;height:38px;margin-top:6px;border-radius:6px}
.review{position:fixed;inset:0;z-index:45;background:var(--body);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
.rv-in{max-width:760px;margin:0 auto}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv-head h2{margin:0;font-size:24px}
.wv{display:block;width:100%;height:210px;border-radius:10px;background:#000;touch-action:none;margin-top:10px;cursor:crosshair}
#rvView{margin-top:10px}
.rv-read{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.rv-read b{font-size:20px}
.rv-read span{color:var(--ink-2);font-size:15px}
.rv-btns{display:grid;grid-template-columns:1fr 1fr 0.7fr;gap:8px;margin-top:8px}
.rv-btns .btn{height:50px;font-size:15px}
.btn:disabled{opacity:.45}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
#rvCues{list-style:none;margin:0;padding:0}
#rvCues li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
#rvCues small{color:var(--ink-2)}

/* overlay + toast */
.start{position:fixed;inset:0;z-index:50;background:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.start h1{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:52px;margin:0;line-height:1}
.start p{max-width:34ch;margin:0;color:var(--ink-2);font-size:16px;line-height:1.4}

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseV=s=>/^-?\d+(\.\d+)?$/.test(s)?Number(s):s;

/* ================= MUSIC START ================= */
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MODES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10]};
const ROMAN=['I','II','III','IV','V','VI','VII'];
const DIR_LABEL={u:'7',ur:'9',r:'add9',dr:'6',d:'sus4',dl:'sus2',l:'flip',ul:'V7'};
const DIR_ADD={c:'',u:'7',ur:'9',r:'add9',dr:'6',d:'sus4',dl:'sus2',l:'',ul:'7'};

function sc(deg){ const m=MODES[S.mode]; return m[deg%7]+12*Math.floor(deg/7); }
function triName(t,f){ if(t===4&&f===7) return ''; if(t===3&&f===7) return 'm'; if(t===3&&f===6) return '°'; if(t===4&&f===8) return '+'; return ''; }
function sevName(t,f,s){
  if(t===4&&f===7&&s===11) return 'maj7'; if(t===4&&f===7&&s===10) return '7'; if(t===3&&f===7&&s===10) return 'm7';
  if(t===3&&f===6&&s===10) return 'm7♭5'; if(t===3&&f===6&&s===9) return '°7'; if(t===3&&f===7&&s===11) return 'm(maj7)';
  return triName(t,f)+'7';
}
function nineName(t,f,s,n){
  const b=sevName(t,f,s);
  if(n===14){ if(b==='maj7') return 'maj9'; if(b==='7') return '9'; if(b==='m7') return 'm9'; return b+'(9)'; }
  if(n===13) return b+'(♭9)';
  return b+'(♯9)';
}
function chordFor(deg,dir){
  const r=sc(deg), t=sc(deg+2)-r, f=sc(deg+4)-r, s=sc(deg+6)-r, n=sc(deg+8)-r;
  const tri=triName(t,f); let ints, suf;
  switch(dir){
    case 'u':  ints=[0,t,f,s]; suf=sevName(t,f,s); break;
    case 'ur': ints=f===7?[0,t,s,n]:[0,t,f,s,n]; suf=nineName(t,f,s,n); break;
    case 'r':  ints=[0,t,f,14]; suf=tri==='m'?'m(add9)':tri+'add9'; break;
    case 'dr': ints=[0,t,f,9]; suf=tri==='°'?'°7':tri+'6'; break;
    case 'd':  ints=[0,5,7]; suf='sus4'; break;
    case 'dl': ints=[0,2,7]; suf='sus2'; break;
    case 'l':  { const t2=t===4?3:4; ints=[0,t2,7]; suf=t2===3?'m':''; break; }
    case 'ul': ints=[0,4,7,10]; suf='7'; break;
    default:   ints=[0,t,f]; suf=tri;
  }
  return {rootRel:r%12, ints, suf};
}
function chName(ch){ return NOTE[(S.key+ch.rootRel)%12]+ch.suf; }
function numeral(deg,ch,dir){
  let r=ROMAN[deg]; if(ch.ints[1]===3) r=r.toLowerCase();
  if(dir==='c'&&ch.suf==='°') r+='°';
  return r+DIR_ADD[dir];
}
let lastVoicing=null;
function scoreV(notes){
  const mean=notes.reduce((a,b)=>a+b,0)/notes.length;
  if(!lastVoicing||!lastVoicing.length) return Math.abs(mean-61);
  let s=0;
  for(const x of notes){ let m=99; for(const p of lastVoicing) m=Math.min(m,Math.abs(p-x)); s+=m; }
  for(const p of lastVoicing){ let m=99; for(const x of notes) m=Math.min(m,Math.abs(p-x)); s+=m; }
  return s+Math.abs(mean-61)*0.6;
}
function voiceChord(ch){
  const rp=(S.key+ch.rootRel)%12, ints=ch.ints, n=ints.length;
  let best=null;
  if(S.voiceLead){
    for(let k=0;k<n;k++){
      const rot=ints.slice(k).concat(ints.slice(0,k).map(x=>x+12));
      const lowPc=(rp+rot[0])%12;
      for(let L=48;L<66;L++){
        if(L%12!==lowPc) continue;
        const notes=rot.map(x=>L+x-rot[0]).sort((a,b)=>a-b);
        if(notes[0]<47||notes[notes.length-1]>81) continue;
        const s=scoreV(notes);
        if(!best||s<best.s) best={notes,s};
      }
    }
  }
  if(!best){ let L=rp; while(L<53) L+=12; best={notes:ints.map(x=>L+x).sort((a,b)=>a-b)}; }
  lastVoicing=best.notes.slice();
  return {notes:best.notes.map(x=>x+12*S.octave), bass:S.bass?36+rp:null};
}
/* ================= MUSIC END ================= */

const LETTERS=['A','B','C','D'];
const SEC_COLORS=['var(--sa)','var(--sb)','var(--sc)','var(--sd)'];
const DRUM_NAMES=['Kick','Snare','Clap','Hat','Open','Perc'];
const STYLE_NAME={hold:'Hold',strum:'Strum',pulse:'Pulse',arp:'Arp'};
const PRESETS={
  tine:  {name:'Tine',     body:1.25,bodyRatio:1,tine:0.55,tineRatio:14,tineMix:0.4, decay:2.2,release:0.07,tone:0.55,bark:0.3, trem:0.25,tremRate:4.2,tremMode:'pan',chorus:0.15,delay:0.08,reverb:0.2},
  suit:  {name:'Suitcase', body:1.5, bodyRatio:1,tine:0.6, tineRatio:14,tineMix:0.35,decay:2.4,release:0.08,tone:0.45,bark:0.45,trem:0.75,tremRate:5.2,tremMode:'pan',chorus:0.05,delay:0.06,reverb:0.18},
  reed:  {name:'Reed',     body:2.6, bodyRatio:1,tine:0.25,tineRatio:5, tineMix:0.2, decay:1.3,release:0.05,tone:0.42,bark:0.65,trem:0.45,tremRate:5.8,tremMode:'amp',chorus:0,   delay:0.05,reverb:0.15},
  fm:    {name:'Bright FM',body:0.9, bodyRatio:1,tine:0.9, tineRatio:14,tineMix:0.6, decay:2.8,release:0.09,tone:0.85,bark:0.12,trem:0,   tremRate:4,  tremMode:'pan',chorus:0.55,delay:0.14,reverb:0.28},
  mellow:{name:'Mellow',   body:0.65,bodyRatio:1,tine:0.22,tineRatio:14,tineMix:0.2, decay:3,  release:0.1, tone:0.28,bark:0.18,trem:0.3, tremRate:3.4,tremMode:'pan',chorus:0.3, delay:0.12,reverb:0.32}
};
const KITS={
  studio:{name:'Studio', kHi:150,kLo:50,kSw:0.08,kDec:0.38,kClick:0.35,snDec:0.17,snTone:190,snBP:3000,hat:0.045,oh:0.35,lp:16000,perc:'rim'},
  tr:    {name:'Machine',kHi:115,kLo:41,kSw:0.13,kDec:0.95,kClick:0,   snDec:0.2, snTone:235,snBP:4200,hat:0.035,oh:0.5, lp:15000,perc:'rim'},
  dusty: {name:'Dusty',  kHi:125,kLo:47,kSw:0.07,kDec:0.3, kClick:0.2, snDec:0.13,snTone:175,snBP:2000,hat:0.035,oh:0.22,lp:4800, perc:'shaker'}
};
const DRUM_PRESETS={
  pop:  {name:'Soft pop',          t:['X.......X.x.....','....X.......X...','................','x.x.x.x.x.x.x.x.','..............x.','................']},
  four: {name:'Four on the floor', t:['X...X...X...X...','................','....X.......X...','x...x...x...x...','..X...X...X...X.','................']},
  boom: {name:'Boom bap',          t:['X......x..X.....','....X.......X...','................','x.x.x.x.x.x.x.x.','................','..............x.']},
  half: {name:'Half-time',         t:['X.........x.....','........X.......','................','x.x.x.x.x.x.x.x.','................','......x.......x.']},
  bossa:{name:'Bossa',             t:['X..xX..xX..xX..x','................','................','x.x.x.x.x.x.x.x.','................','X..X..X...X..X..']},
  empty:{name:'Empty',             t:['','','','','','']}
};
function pat(str){ const a=[]; for(let i=0;i<16;i++){ const c=str[i]; a.push(c==='X'?2:c==='x'?1:0); } return a; }
function pat6(k){ return DRUM_PRESETS[k].t.map(pat); }

function defaults(){
  return {
    v:1,key:0,mode:'major',bpm:92,swing:0,quant:1,style:'hold',voiceLead:true,bass:false,octave:0,latch:false,metro:false,
    snd:Object.assign({preset:'tine'},PRESETS.tine),kit:'studio',lv:{keys:0.8,drums:0.75,master:0.8},
    sections:['Verse','Chorus','Bridge','Outro'].map(name=>({name,bars:4,chords:[],drums:pat6('empty')})),
    songMode:false,chain:[{sec:0,rep:2},{sec:1,rep:2},{sec:0,rep:1},{sec:2,rep:1},{sec:1,rep:2}],songEnd:'stop',switchAt:'loop',autoFill:true,
    edLen:16,edSnap:4,
    tp:{split:0,preroll:2,slate:true,tail:4,midiCue:true,midiRec:false,midiLoop:-1,takeMode:'loop',takeReps:4,countIn:true,chk:{},cueEvery:1,startMode:'start',clock:true,midiOffset:0},
    takes:[],takeN:0
  };
}
function mkEvent(deg,dir,s,len){
  const ch=chordFor(deg,dir), v=voiceChord(ch);
  return {s,len,deg,dir,rootRel:ch.rootRel,suf:ch.suf,num:numeral(deg,ch,dir),notes:v.notes.map(n=>n-S.key),bass:v.bass==null?null:v.bass-S.key};
}
function seedDemo(){
  lastVoicing=null; const sx=S.sections;
  sx[0].bars=4; sx[0].chords=[mkEvent(0,'c',0,16),mkEvent(4,'c',16,16),mkEvent(5,'u',32,16),mkEvent(3,'r',48,16)]; sx[0].drums=pat6('pop');
  sx[1].bars=4; sx[1].chords=[mkEvent(5,'c',0,16),mkEvent(3,'u',16,16),mkEvent(0,'c',32,16),mkEvent(4,'d',48,8),mkEvent(4,'c',56,8)]; sx[1].drums=pat6('four');
  sx[2].bars=2; sx[2].chords=[mkEvent(1,'u',0,16),mkEvent(4,'u',16,16)]; sx[2].drums=pat6('half');
  sx[3].bars=4; sx[3].chords=[]; sx[3].drums=pat6('empty');
  lastVoicing=null;
}
const LS='tinebox.v1';
function load(){
  try{
    const raw=localStorage.getItem(LS); if(!raw) return null;
    const o=JSON.parse(raw); if(!o||!Array.isArray(o.sections)||o.sections.length!==4) return null;
    const d=defaults();
    return Object.assign(d,o,{snd:Object.assign(d.snd,o.snd),lv:Object.assign(d.lv,o.lv),tp:Object.assign(d.tp,o.tp)});
  }catch(e){ return null; }
}
function save(){ clearTimeout(save.t); save.t=setTimeout(saveNow,300); }
function saveNow(){
  for(let keep=S.takes?S.takes.length:0;;){
    try{ localStorage.setItem(LS,JSON.stringify(S)); return; }
    catch(e){
      const olds=(S.takes||[]).filter((k,i)=>i>=keep&&k.wave);
      if(keep<=0&&!olds.length){ toast('Storage is full. Clear old takes to keep saving.'); return; }
      keep=Math.max(0,keep-5); (S.takes||[]).forEach((k,i)=>{ if(i>=keep) delete k.wave; });
      if(keep===0) toast('Storage was full, so older take waveforms were removed.');
    }
  }
}

let S=null;
const R={playing:false,recArmed:false,cur:0,queued:null,dir:'c',absStep:0,secStep:0,chainPos:0,rep:0,nextTime:0,
  history:[],gate:null,voices:[],undo:[],cues:[],cueN:-1,zeroTime:null,slateTime:null,take:null,muteK:false,muteD:false,
  crashNext:false,openHat:null,disp:[],skipChord:null,skipDrum:new Set(),midi:null,midiOutId:'',wake:null,tone:null,
  laneSec:-1,heardSec:-1,gridCol:-1,peaks:[],meterHold:[0,0],clipAt:-10,
  palDir:'c',palSel:null,selEv:null,mcues:[],cap:null,markTime:null,chainOverride:null,loopOpen:false,loopMarked:false,tlSec:-1};
function activeChain(){ if(R.chainOverride) return R.chainOverride; if(R.take&&S.tp.takeMode==='jam') return null; return S.songMode&&S.chain.length?S.chain:null; }

/* ================= AUDIO ================= */
let ctx=null; const A={};
const stepDur=()=>60/S.bpm/4;
const lat=()=>ctx?((ctx.outputLatency||0)+(ctx.baseLatency||0)):0;
function initAudio(){
  if(ctx){ if(ctx.state!=='running') ctx.resume().catch(()=>{}); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ toast('This browser has no Web Audio.'); return; }
  ctx=new AC({latencyHint:'interactive'});
  const G=(v=1)=>{ const n=ctx.createGain(); n.gain.value=v; return n; };
  // keys chain
  A.keysIn=G(1);
  A.drive=ctx.createWaveShaper(); A.drive.oversample='2x';
  A.hp=ctx.createBiquadFilter(); A.hp.type='highpass'; A.hp.frequency.value=30;
  A.tone=ctx.createBiquadFilter(); A.tone.type='lowpass'; A.tone.Q.value=0.5;
  A.trem=G(1); A.pan=ctx.createStereoPanner();
  A.lfo=ctx.createOscillator(); A.lfo.frequency.value=4; A.lfoTrem=G(0); A.lfoPan=G(0);
  A.lfo.connect(A.lfoTrem); A.lfoTrem.connect(A.trem.gain); A.lfo.connect(A.lfoPan); A.lfoPan.connect(A.pan.pan); A.lfo.start();
  A.keysIn.connect(A.drive); A.drive.connect(A.hp); A.hp.connect(A.tone); A.tone.connect(A.trem); A.trem.connect(A.pan);
  A.chDry=G(1); A.chWet=G(0);
  const spl=ctx.createChannelSplitter(2), mer=ctx.createChannelMerger(2);
  A.dL=ctx.createDelay(0.05); A.dR=ctx.createDelay(0.05); A.dL.delayTime.value=0.012; A.dR.delayTime.value=0.018;
  const chLfo=ctx.createOscillator(); chLfo.frequency.value=0.7; const cl=G(0.0025), cr=G(-0.0025);
  chLfo.connect(cl); chLfo.connect(cr); cl.connect(A.dL.delayTime); cr.connect(A.dR.delayTime); chLfo.start();
  A.pan.connect(A.chDry); A.pan.connect(spl); spl.connect(A.dL,0); spl.connect(A.dR,1);
  A.dL.connect(mer,0,0); A.dR.connect(mer,0,1); mer.connect(A.chWet);
  A.keysOut=G(0.8); A.chDry.connect(A.keysOut); A.chWet.connect(A.keysOut);
  A.keysBus=G(1); A.drumsBus=G(1); A.keysOut.connect(A.keysBus);
  A.rev=ctx.createConvolver(); A.rev.buffer=makeIR(2.4); A.revSend=G(0.2);
  A.keysOut.connect(A.revSend); A.revSend.connect(A.rev); A.rev.connect(A.keysBus);
  A.dly=ctx.createDelay(2); A.dlySend=G(0.1); A.dlyFb=G(0.35); A.dlyLP=ctx.createBiquadFilter(); A.dlyLP.type='lowpass'; A.dlyLP.frequency.value=3500;
  A.keysOut.connect(A.dlySend); A.dlySend.connect(A.dly); A.dly.connect(A.dlyLP); A.dlyLP.connect(A.dlyFb); A.dlyFb.connect(A.dly); A.dlyLP.connect(A.keysBus);
  // drums chain
  A.drumsIn=G(0.32); A.drumLP=ctx.createBiquadFilter(); A.drumLP.type='lowpass'; A.drumsOut=G(0.75);
  A.drumsIn.connect(A.drumLP); A.drumLP.connect(A.drumsOut); A.drumsOut.connect(A.drumsBus);
  // routing: stereo mix or split (keys left, drums right)
  A.mixSel=G(1); A.splitSel=G(0);
  A.keysBus.connect(A.mixSel); A.drumsBus.connect(A.mixSel);
  const km=G(1), dm=G(1);
  [km,dm].forEach(n=>{ n.channelCount=1; n.channelCountMode='explicit'; n.channelInterpretation='speakers'; });
  A.keysBus.connect(km); A.drumsBus.connect(dm);
  const sm=ctx.createChannelMerger(2); km.connect(sm,0,0); dm.connect(sm,0,1); sm.connect(A.splitSel);
  A.master=G(0.8); A.mixSel.connect(A.master); A.splitSel.connect(A.master);
  A.lim=ctx.createDynamicsCompressor(); A.lim.threshold.value=-2; A.lim.knee.value=0; A.lim.ratio.value=20; A.lim.attack.value=0.002; A.lim.release.value=0.12;
  A.master.connect(A.lim);
  A.out=G(1); A.lim.connect(A.out); A.out.connect(ctx.destination);
  A.fixed=G(1); A.fixed.connect(A.out);           // test tone and slate bypass the limiter
  A.click=G(0.35); A.click.connect(A.master);
  const ms=ctx.createChannelSplitter(2); A.anL=ctx.createAnalyser(); A.anR=ctx.createAnalyser(); A.anL.fftSize=A.anR.fftSize=1024;
  A.out.connect(ms); ms.connect(A.anL,0); ms.connect(A.anR,1);

function makeIR(sec){
  const sr=ctx.sampleRate, len=Math.floor(sr*sec), b=ctx.createBuffer(2,len,sr);

  const n=1024, c=new Float32Array(n), dd=0.6+b*3.2, a=0.18*b;

function applySound(){
  if(!ctx) return; const P=S.snd, now=ctx.currentTime, st=(p,v)=>p.setTargetAtTime(v,now,0.04);
  st(A.tone.frequency,1200*Math.pow(2,P.tone*3.4));

function applyMix(){
  if(!ctx) return; const now=ctx.currentTime, st=(p,v)=>p.setTargetAtTime(v,now,0.02);
  st(A.keysOut.gain,S.lv.keys); st(A.drumsOut.gain,S.lv.drums); st(A.master.gain,S.lv.master);
  st(A.keysBus.gain,R.muteK?0:1); st(A.drumsBus.gain,R.muteD?0:1);

function applyRouting(){ if(!ctx) return; const sp=!!S.tp.split, now=ctx.currentTime; A.mixSel.gain.setTargetAtTime(sp?0:1,now,0.01); A.splitSel.gain.setTargetAtTime(sp?1:0,now,0.01); }
function applyKit(){ if(!ctx) return; A.drumLP.frequency.setTargetAtTime(KITS[S.kit].lp,ctx.currentTime,0.02); }

/* electric piano voice: two FM pairs, body (1:1) and tine (1:14) */
function epNote(midi,t,vel,relAt){
  const P=S.snd, f=440*Math.pow(2,(midi-69)/12);
  const out=ctx.createGain(); out.gain.value=0;
  const c1=ctx.createOscillator(), m1=ctx.createOscillator(), m1g=ctx.createGain();
  const c2=ctx.createOscillator(), m2=ctx.createOscillator(), m2g=ctx.createGain(), c2g=ctx.createGain();
  let tr=P.tineRatio; while(tr>1&&f*tr>ctx.sampleRate*0.42) tr--;
  c1.frequency.value=f; m1.frequency.value=f*P.bodyRatio; c2.frequency.value=f; c2.detune.value=3; m2.frequency.value=f*tr;
  c2g.gain.value=P.tineMix;
  m1.connect(m1g); m1g.connect(c1.frequency); m2.connect(m2g); m2g.connect(c2.frequency);
  c1.connect(out); c2.connect(c2g); c2g.connect(out); out.connect(A.keysIn);
  const hard=0.55+0.45*vel, bodyDev=P.body*hard*f*P.bodyRatio, tineDev=P.tine*hard*f*tr;
  m1g.gain.setValueAtTime(bodyDev,t); m1g.gain.setTargetAtTime(bodyDev*0.22,t+0.005,0.25+P.decay*0.1);
  m2g.gain.setValueAtTime(tineDev,t); m2g.gain.setTargetAtTime(0,t+0.002,0.035);
  const pf=clamp(Math.pow(2,(60-midi)/24),0.45,1.8), dec=P.decay*pf, peak=0.2*vel;
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(peak,t+0.003);
  out.gain.setTargetAtTime(peak*0.6,t+0.003,0.09); out.gain.setTargetAtTime(0,t+0.25,dec);
  const oscs=[c1,m1,c2,m2]; oscs.forEach(o=>o.start(t));
  const v={t,relAt:Infinity,stopAt:t+dec*7+0.3};
  oscs.forEach(o=>o.stop(v.stopAt));
  c1.onended=()=>{ try{ out.disconnect(); c2g.disconnect(); m1g.disconnect(); m2g.disconnect(); }catch(e){} const i=R.voices.indexOf(v); if(i>=0) R.voices.splice(i,1); };
  v.release=r=>{
    r=Math.max(r,t+0.02); if(r>=v.relAt) return; v.relAt=r;
    out.gain.cancelScheduledValues(r); out.gain.setTargetAtTime(0,r,P.release);
    const s=r+P.release*8; if(s<v.stopAt){ v.stopAt=s; oscs.forEach(o=>{ try{ o.stop(s); }catch(e){} }); }
  };
  R.voices.push(v); if(relAt!=null) v.release(relAt);
  while(R.voices.length>64){ const o=R.voices.shift(); o.release(ctx.currentTime); }
  return v;
}
function playChord(notes,bass,t,style,relAt,vel){
  const vs=[];
  if(bass!=null) vs.push(epNote(bass,t,vel*0.9,relAt));
  notes.forEach((n,i)=>vs.push(epNote(n,style==='strum'?t+i*0.024:t,vel*(0.92+Math.random()*0.08),relAt)));
  return vs;
}

/* drums */
function env(g,t,v,dec){ g.gain.setValueAtTime(Math.max(v,0.0001),t); g.gain.exponentialRampToValueAtTime(0.0001,t+dec); }
function nsrc(t,dur){ const s=ctx.createBufferSource(); s.buffer=A.noise; s.loop=true; s.start(t,Math.random()); s.stop(t+dur+0.05); return s; }
function filt(type,freq,q){ const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q; return f; }
function drum(i,t,v){
  const K=KITS[S.kit], out=A.drumsIn, G=()=>{ const g=ctx.createGain(); g.gain.value=0; return g; };
  if(i===0){
    const o=ctx.createOscillator(), g=G(); o.frequency.setValueAtTime(K.kHi,t); o.frequency.exponentialRampToValueAtTime(K.kLo,t+K.kSw);
    env(g,t,v,K.kDec); o.connect(g); g.connect(out); o.start(t); o.stop(t+K.kDec+0.05);
    if(K.kClick){ const n=nsrc(t,0.02), f=filt('highpass',2500), g2=G(); env(g2,t,v*K.kClick,0.015); n.connect(f); f.connect(g2); g2.connect(out); }
  } else if(i===1){
    const n=nsrc(t,K.snDec), f=filt('bandpass',K.snBP,0.6), g=G(); env(g,t,v*0.7,K.snDec); n.connect(f); f.connect(g); g.connect(out);
    const o=ctx.createOscillator(), g2=G(); o.type='triangle'; o.frequency.setValueAtTime(K.snTone,t); o.frequency.exponentialRampToValueAtTime(K.snTone*0.8,t+0.08);
    env(g2,t,v*0.45,0.1); o.connect(g2); g2.connect(out); o.start(t); o.stop(t+0.15);
  } else if(i===2){
    const n=nsrc(t,0.3), f=filt('bandpass',1150,1.1), g=G(), a=v*0.8;
    g.gain.setValueAtTime(a,t); g.gain.setValueAtTime(a*0.15,t+0.009); g.gain.setValueAtTime(a,t+0.018); g.gain.setValueAtTime(a*0.15,t+0.027);
    g.gain.setValueAtTime(a,t+0.036); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    n.connect(f); f.connect(g); g.connect(out);
  } else if(i===3||i===4){
    if(R.openHat){ const og=R.openHat.gain; try{ if(og.cancelAndHoldAtTime) og.cancelAndHoldAtTime(t); else og.cancelScheduledValues(t); og.setTargetAtTime(0.0001,t,0.008); }catch(e){} R.openHat=null; }
    const open=i===4, dec=open?K.oh:K.hat, n=nsrc(t,dec), f=filt('highpass',open?6500:7500), g=G();
    env(g,t,v*0.3,dec); n.connect(f); f.connect(g); g.connect(out); if(open) R.openHat=g;
  } else if(i===5){
    if(K.perc==='rim'){ const o=ctx.createOscillator(), f=filt('bandpass',1700,3), g=G(); o.type='square'; o.frequency.value=820; env(g,t,v*0.5,0.035); o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t+0.06); }
    else { const n=nsrc(t,0.09), f=filt('bandpass',6000,1.5), g=G(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v*0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09); n.connect(f); f.connect(g); g.connect(out); }
  } else if(i===6){
    const n=nsrc(t,1.8), f=filt('highpass',5000), g=G(); env(g,t,v*0.28,1.8); n.connect(f); f.connect(g); g.connect(out);
  }
}
function click(t,acc){ const o=ctx.createOscillator(), g=ctx.createGain(); g.gain.value=0; o.frequency.value=acc?1760:1320; env(g,t,acc?0.5:0.3,0.04); o.connect(g); g.connect(A.click); o.start(t); o.stop(t+0.06); }
function slate(t){
  R.slateTime=t; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=1000;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.004); g.gain.setValueAtTime(0.25,t+0.116); g.gain.linearRampToValueAtTime(0,t+0.12);
  o.connect(g); g.connect(A.fixed); o.start(t); o.stop(t+0.13);
}

/* ================= SEQUENCER ================= */
function pushHist(h){ R.history.push(h); if(R.history.length>128) R.history.shift(); }
function histAt(time){ const H=R.history; for(let k=H.length-1;k>=0;k--) if(H[k].time<=time) return H[k]; return null; }
function posAt(time){ const h=histAt(time); if(!h||h.sec==null) return null; return {abs:h.abs+clamp((time-h.time)/h.dur,0,1.5),h}; }

function scheduler(){
  if(!ctx||ctx.state!=='running') return;
  if(R.nextTime<ctx.currentTime-0.25) R.nextTime=ctx.currentTime+0.02;
  const ahead=ctx.currentTime+0.12;
  while(R.nextTime<ahead){ scheduleStep(R.nextTime); R.nextTime+=stepDur(); }
}
function scheduleStep(t){
  const dur=stepDur(); let tt=t;
  if(midiReady()){
    if(R.playing&&R.take&&R.absStep===0&&R.take.startMode){ if(R.take.startMode==='start') midiSend([0xFA],t); else if(R.take.startMode==='rocker') midiSend([0xB0,18,68],t); }
    if(S.tp.clock) for(let i=0;i<6;i++) midiSend([0xF8],t+i*dur/6);
  }
  if(R.playing){
    const abs=R.absStep;
    if(((abs%2)+2)%2===1) tt=t+(S.swing/100)*dur/3;
    if(abs<0){
      pushHist({time:t,dur,abs,sec:null,secStep:-1});
      if(R.take&&abs===-16&&(S.tp.slate||S.tp.countIn)) R.markTime=t;
      if(R.take&&S.tp.slate&&abs===-16) slate(t);
      else if(R.take&&S.tp.countIn&&abs>=-16&&abs%4===0) click(t,abs===-16);
    } else {
      if(abs===0){ R.zeroTime=t; logCue(R.cur,t); passStart(t); }
      if(R.take&&abs%16===0) barCue(abs/16,t);
      const sec=S.sections[R.cur], p=R.secStep;
      pushHist({time:t,dur,abs,sec:R.cur,secStep:p});
      if(p%16===0) R.crashNext=false;
      drumStep(sec,p,tt,abs);
      if(S.metro&&p%4===0) click(tt,p%16===0);
      const ev=sec.chords.find(e=>e.s===p);
      if(ev){
        if(R.skipChord===abs) R.skipChord=null;
        else if(!(R.recArmed&&R.gate&&R.gate.live&&R.gate.held)) startSeqGate(ev,tt,dur);
      }
      R.secStep++;
      if(R.secStep%16===0) advance(t+dur);
    }
    if(R.playing) R.absStep++;
  }
  tickGate(tt,dur);
}
function willChange(barStart){
  const len=S.sections[R.cur].bars*16, lastBar=barStart+16>=len;
  const ch=activeChain();
  if(ch){ if(!lastBar) return false; const it=ch[R.chainPos]; return !!it&&R.rep+1>=it.rep&&R.chainPos+1<ch.length; }
  return R.queued!==null&&(S.switchAt==='bar'||lastBar);
}
function drumStep(sec,p,t,abs){
  const s=p%16;
  if(S.autoFill&&s>=12&&willChange(p-s)){
    if(!R.muteD){ if(s===12) drum(0,t,0.9); drum(1,t,0.45+(s-12)*0.18); }
    R.crashNext=true; return;
  }
  for(let i=0;i<6;i++){
    const v=sec.drums[i][s]; if(!v) continue;
    const key=abs+':'+i; if(R.skipDrum.has(key)){ R.skipDrum.delete(key); continue; }
    drum(i,t,v===2?1:0.72);
  }
}
function advance(tNext){
  const len=S.sections[R.cur].bars*16, loopEnd=R.secStep>=len, ch=activeChain();
  if(loopEnd) passEnd(tNext);
  if(ch){
    if(!loopEnd) return;
    R.secStep=0; R.rep++;
    const it=ch[R.chainPos];
    if(!it||R.rep>=it.rep){
      R.rep=0; R.chainPos++;
      if(R.chainPos>=ch.length){
        if(S.songEnd==='loop'&&!R.take) R.chainPos=0;
        else { endSong(tNext); return; }
      }
      setSection(ch[R.chainPos].sec,tNext);
    } else passStart(tNext);
  } else if(R.queued!==null&&(S.switchAt==='bar'||loopEnd)){ const q=R.queued; R.queued=null; setSection(q,tNext); }
  else if(loopEnd){ R.secStep=0; passStart(tNext); }
}
function setSection(i,t){
  passEnd(t);
  R.cur=i; R.secStep=0;
  if(R.crashNext){ if(!R.muteD) drum(6,t,0.8); R.crashNext=false; }
  logCue(i,t); passStart(t);
}
/* MIDI to TP-7 during takes: cue rec mode (CC 16) + one note per cue, loop in/out (CC 17) */
function logCue(i,t){ R.cues.push({sec:i,name:S.sections[i].name,t,note:null}); }
/* one TP-7 cue per section start, or per N bars; notes 36..127 give up to 92 cues per take */
function barCue(bar,t){
  if(!(S.tp.midiCue&&midiReady())) return;
  const last=R.cues[R.cues.length-1], isSec=!!last&&Math.abs(last.t-t)<1e-4, ev=S.tp.cueEvery;
  if(!(isSec||(ev!=='section'&&bar%ev===0))) return;
  const note=36+R.mcues.length; if(note>127) return;
  midiSend([0x90,note,100],t); R.mcues.push({t,note,bar}); if(isSec) last.note=note;
}
function passStart(t){ if(R.take&&S.tp.midiLoop===R.cur&&!R.loopMarked&&!R.loopOpen){ midiSend([0xB0,17,1],t); R.loopOpen=true; } }
function passEnd(t){ if(R.loopOpen){ midiSend([0xB0,17,2],t); R.loopOpen=false; R.loopMarked=true; } }

/* gates: one chord sounds at a time, live or sequenced */
function startGate(g,t){
  const p=R.gate;
  if(p){ if(p.rec) commitRec(p,t); endGateVoices(p,t); }
  g.start=t; g.idx=0; g.voices=[]; g.style=S.style; R.gate=g;
  if(g.style==='hold'||g.style==='strum') g.voices=playChord(g.notes,g.bass,t,g.style,g.end,0.8);
  else if(g.live) fireGateStep(g,t,stepDur());
  lastVoicing=g.notes.map(n=>n-12*S.octave);
  R.disp.push({name:g.name,num:g.num,at:t}); R.disp.sort((a,b)=>a.at-b.at); if(R.disp.length>12) R.disp.shift();
}
function endGateVoices(g,t){ g.voices.forEach(v=>v.release(t)); g.voices=[]; if(g.end==null||t<g.end) g.end=t; g.held=false; }
function fireGateStep(g,t,dur){
  const i=g.idx++;
  if(i===0&&g.bass!=null) g.voices.push(epNote(g.bass,t,0.78,g.end));
  if(g.style==='pulse'){ if(i%2===0) playChord(g.notes,null,t,'hold',t+dur*1.6,i%8===0?0.86:0.7); }
  else {
    if(!g.arp){ const up=[...g.notes].sort((a,b)=>a-b); g.arp=up.concat(up.map(n=>n+12)); }
    epNote(g.arp[i%g.arp.length],t,i%4===0?0.82:0.68,t+dur*0.92);
  }
}
function tickGate(t,dur){
  const g=R.gate; if(!g||(g.style!=='pulse'&&g.style!=='arp')) return;
  if(g.end!=null&&t>=g.end-0.002) return;
  if(g.live){ if(t<g.start+0.03) return; } else if(t<g.start-0.002) return;
  fireGateStep(g,t,dur);
}
function startSeqGate(ev,t,dur){
  startGate({live:false,held:false,notes:ev.notes.map(n=>n+S.key),bass:ev.bass==null?null:ev.bass+S.key,end:t+ev.len*dur,
    name:NOTE[(S.key+ev.rootRel)%12]+ev.suf,num:ev.num},t);
}

/* a new chord trims whatever it overlaps instead of deleting it */
function insertEvent(sec,ev){
  const a=ev.s, b=ev.s+ev.len, out=[];
  for(const e of sec.chords){
    if(e===ev) continue;
    const ea=e.s, eb=e.s+e.len;
    if(eb<=a||ea>=b){ out.push(e); continue; }
    if(ea<a){ if(eb>b) out.push(Object.assign({},e,{s:b,len:eb-b,notes:e.notes.slice()})); e.len=a-ea; out.push(e); continue; }
    if(eb>b){ e.len=eb-b; e.s=b; out.push(e); }
  }
  out.push(ev); out.sort((x,y)=>x.s-y.s); sec.chords=out;
}

/* live playing and recording */
function keyDown(deg){
  initAudio(); if(!ctx) return;
  const dir=R.dir, ch=chordFor(deg,dir), v=voiceChord(ch), t=ctx.currentTime+0.004;
  const g={live:true,held:true,keyId:deg,dir,notes:v.notes,bass:v.bass,end:null,name:chName(ch),num:numeral(deg,ch,dir),rootRel:ch.rootRel,suf:ch.suf};
  startGate(g,t);
  if(R.playing&&R.recArmed) beginRec(g,t);
}
function keyUp(deg){
  const g=R.gate; if(!ctx||!g||!g.live||!g.held||g.keyId!==deg) return;
  const t=ctx.currentTime+0.004; if(g.rec) commitRec(g,t); endGateVoices(g,t);
}
function beginRec(g,t){
  const p=posAt(t-lat()); if(!p) return;
  const q=S.quant, qa=Math.round(p.abs/q)*q, L=S.sections[p.h.sec].bars*16;
  let s=p.h.secStep+(qa-p.h.abs); s=((s%L)+L)%L;
  g.rec={sec:p.h.sec,s,abs:qa};
}
function commitRec(g,t){
  const r=g.rec; g.rec=null; if(!r) return;
  const q=S.quant, p=posAt(t-lat()), endAbs=p?Math.round(p.abs/q)*q:r.abs+q;
  const sec=S.sections[r.sec], L=sec.bars*16;
  const len=Math.min(Math.max(q,endAbs-r.abs),L-r.s);
  pushUndo(r.sec);
  insertEvent(sec,{s:r.s,len,deg:g.keyId,dir:g.dir,rootRel:g.rootRel,suf:g.suf,num:g.num,notes:g.notes.map(n=>n-S.key),bass:g.bass==null?null:g.bass-S.key});
  if(r.abs>=R.absStep) R.skipChord=r.abs;
  save(); renderSecs(); if(R.laneSec===r.sec) renderLane(r.sec); renderTL();
}
function padHit(i){
  initAudio(); if(!ctx) return;
  const t=ctx.currentTime+0.003; drum(i,t,0.9);
  if(!(R.playing&&R.recArmed)) return;
  const p=posAt(t-lat()); if(!p) return;
  const qa=Math.round(p.abs), sec=S.sections[p.h.sec], L=sec.bars*16;
  let s=p.h.secStep+(qa-p.h.abs); s=(((s%L)+L)%L)%16;
  pushUndo(p.h.sec,'pad');
  if(!sec.drums[i][s]) sec.drums[i][s]=1;
  if(qa>=R.absStep) R.skipDrum.add(qa+':'+i);
  save(); if(p.h.sec===R.cur) renderGrid(); renderSecs();
}

/* transport */
function play(preroll){
  initAudio(); if(!ctx||R.playing) return;
  R.history=[]; R.cues=[]; R.zeroTime=null; R.slateTime=null; R.skipDrum.clear(); R.skipChord=null;
  R.absStep=-(preroll||0)*16; R.secStep=0; R.rep=0; R.queued=null; R.crashNext=false;
  R.loopOpen=false; R.loopMarked=false; R.mcues=[]; R.markTime=null;
  const ch=activeChain(); if(ch){ R.chainPos=0; R.cur=ch[0].sec; }
  if(R.take&&S.tp.midiCue) midiSend([0xB0,16,127]);
  R.nextTime=ctx.currentTime+0.1; R.playing=true; requestWake(); renderTransport();
}
function stop(){
  if(!ctx) return;
  const t=ctx.currentTime+0.01;
  R.playing=false; R.queued=null;
  if(R.gate&&!R.gate.held){ endGateVoices(R.gate,t); R.gate=null; }
  R.voices.slice().forEach(v=>{ if(v.t>t) v.release(t); });
  passEnd(t);
  if(R.take) finishTake(t); else releaseWake();
  renderTransport();
}
function endSong(t){
  R.playing=false; passEnd(t);
  if(R.gate&&!R.gate.held){ endGateVoices(R.gate,t); R.gate=null; }

const MODE_LABEL={loop:'Loop',jam:'Jam',song:'Song'};
function startTake(){
  initAudio(); if(!ctx) return;
  if(R.take&&R.take.phase==='tail') return;
  const m=S.tp.takeMode;
  if(m==='song'&&!S.chain.length){ toast('Add sections to the arrangement in the Song tab first.'); return; }
  if(R.playing) stop();
  R.take={phase:'run',label:m==='loop'?`Loop ${LETTERS[R.cur]} ×${S.tp.takeReps||'∞'}`:m==='jam'?`Jam from ${LETTERS[R.cur]}`:'Song'};
  R.chainOverride=m==='loop'?[{sec:R.cur,rep:S.tp.takeReps||Infinity}]:m==='song'?S.chain.map(c=>({sec:c.sec,rep:c.rep})):null;
  R.lastTake=null;
  R.take.startMode=autoRec()?S.tp.startMode:'manual';
  if(R.take.startMode!=='manual') midiSend([0xB0,14,127]);
  startCapture();
  play(S.tp.preroll);
}
function finishTake(t){
  const tk=R.take; if(!tk||tk.phase!=='run') return;
  tk.phase='tail'; passEnd(t); R.chainOverride=null;
  if(S.tp.midiCue) midiSend([0xB0,16,0]);
  if(R.zeroTime!=null&&R.cues.length&&t>R.zeroTime){
    const n=(S.takeN||0)+1, z=R.zeroTime; S.takeN=n;
    const rec={n,at:Date.now(),label:tk.label,bpm:S.bpm,key:NOTE[S.key]+' '+S.mode,dur:t-z,beep:R.slateTime!=null?z-R.slateTime:null,
      cues:R.cues.map(c=>({l:LETTERS[c.sec],name:c.name,t:c.t-z,note:c.note})),
      mcues:R.mcues.map(c=>({t:c.t-z,note:c.note,bar:c.bar})),cueEvery:S.tp.cueEvery,startMode:tk.startMode||'manual'};
    S.takes.unshift(rec);
    if(S.takes.length>30) S.takes.length=30;
    tk.n=n; tk.rec=rec; save(); renderCues();
  }
  tk.z=R.zeroTime; tk.mark=R.markTime;
  const wait=Math.max(0,t-ctx.currentTime)+S.tp.tail;
  setTimeout(()=>{
    const sm=tk.startMode||'manual';
    if(sm!=='manual'){ if(sm==='start') midiSend([0xFC]); else if(sm==='rocker') midiSend([0xB0,18,64]); midiSend([0xB0,14,0]); }
    R.lastMode=sm;
    stopCapture(tk.rec||null,tk.z,tk.mark); if(tk.rec){ save(); renderCues(); }
    R.lastTake=tk.n||0; R.take=null; releaseWake(); renderTransport();
  },wait*1000);
  renderTransport();
}
function fmtT(s){ const neg=s<0; s=Math.abs(s); const m=Math.floor(s/60), r=s-m*60; return (neg?'-':'')+m+':'+r.toFixed(3).padStart(6,'0'); }
const fmtClock=s=>{ s=Math.max(0,s); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); };
function takeText(k){
  const L=[`Take ${k.n}, ${new Date(k.at).toLocaleString()}`,`${k.label}, ${k.bpm} bpm, ${k.key}, ${fmtClock(k.dur)} long`];
  if(k.beep!=null) L.push(`Start beep: ${fmtT(k.beep)} before the downbeat. If the beep started TP-7 auto record, add ${fmtT(k.beep)} to each time for TP-7 time.`);
  k.cues.forEach(c=>L.push(`${fmtT(c.t)}  ${c.l} ${c.name}${c.note!=null?'  (cue note '+c.note+')':''}`));
  return L.join('\n');
}

const autoRec=()=>midiReady()&&S.tp.startMode!=='manual';
function startHint(phase,mode){
  const m=mode||(autoRec()?S.tp.startMode:'manual');
  if(phase==='ready') return m==='start'?'Start take arms the TP-7 and starts it by MIDI on the downbeat.':m==='rocker'?'Start take arms the TP-7 and rolls its tape by MIDI on the downbeat.':m==='beep'?'Start take arms the TP-7, and the start beep triggers its auto start.':'Press Start take, then press record on the TP-7 during the pre-roll.';
  return m==='start'||m==='rocker'?'TP-7 armed. It starts on the downbeat.':m==='beep'?'TP-7 armed. The beep starts it.':'Press record on the TP-7 now.';
}
function takeState(now){
  const tk=R.take;
  if(!tk){
    if(R.lastTake) return {big:`Take ${R.lastTake} saved`,small:(R.lastMode&&R.lastMode!=='manual')?'The app sent stop to the TP-7. Check that it stopped.':'Stop recording on the TP-7.',rec:false};
    return {big:'Ready',small:startHint('ready'),rec:false};
  }
  if(tk.phase==='tail') return {big:'Ringing out',small:`Stopping in a few seconds. Keep the TP-7 recording.`,rec:true};
  const h=histAt(now);
  if(!h||h.sec==null){
    const bars=h?Math.ceil(-h.abs/16):S.tp.preroll;
    return {big:`Pre-roll ${bars}`,small:startHint('pre',tk.startMode),rec:false};
  }
  const m=S.tp.takeMode;
  const small=m==='loop'?`Pass ${R.rep+1}${S.tp.takeReps?' of '+S.tp.takeReps:''}, ${LETTERS[h.sec]} ${S.sections[h.sec].name}`
    :m==='song'?`Part ${R.chainPos+1} of ${S.chain.length}, ${LETTERS[h.sec]} ${S.sections[h.sec].name}`

  return {big:'Recording '+fmtClock(now-R.zeroTime),small,rec:true};
}

async function midiConnect(){
  const st=$('#midiStatus');
  if(nativeMidi()){ st.textContent='Native MIDI bridge found. MIDI goes to the TP-7 over USB.'; return; }
  if(!navigator.requestMIDIAccess){ st.textContent='This browser has no Web MIDI. On iPhone, open this page in a MIDI browser app such as MIDIWeb Browser. Takes still work without MIDI: press record on the TP-7 by hand.'; return; }
  try{ R.midi=await navigator.requestMIDIAccess(); R.midiNative=/\[native code\]/.test(Function.prototype.toString.call(navigator.requestMIDIAccess)); R.midi.onstatechange=midiList; midiList(); renderTpInfo(); }
  catch(e){ st.textContent='MIDI access was blocked ('+e.name+'). Allow MIDI for this page and try again.'; }
}
function midiList(){
  const sel=$('#midiOut'), outs=[...R.midi.outputs.values()];
  sel.innerHTML=outs.length?outs.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join(''):'<option value="">No MIDI outputs found</option>';
  const tp=outs.find(o=>/tp.?7/i.test(o.name||'')); if(tp) sel.value=tp.id;
  R.midiOutId=sel.value;
  $('#midiStatus').textContent=tp?'TP-7 found. Takes now arm and start it by MIDI.':outs.length?'Pick the TP-7 from the list.':'Connect the TP-7 by USB-C, then press Connect MIDI again.';
}
const nativeMidi=()=>window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.tineboxMidi;
const midiReady=()=>!!(nativeMidi()||(R.midi&&R.midiOutId));
function audioToPerf(at){
  try{ if(ctx.getOutputTimestamp){ const o=ctx.getOutputTimestamp(); if(o&&o.performanceTime>0&&o.contextTime>0) return o.performanceTime+(at-o.contextTime)*1000; } }catch(e){}
  return performance.now()+(at-ctx.currentTime+lat())*1000;
}
function midiSend(bytes,at){
  const nm=nativeMidi(), due=at!=null&&ctx?audioToPerf(at)+(+S.tp.midiOffset||0):null, d=due==null?0:Math.max(0,due-performance.now());
  if(nm){ try{ nm.postMessage({bytes:[...bytes],delayMs:d}); }catch(e){} return; }
  if(!R.midi||!R.midiOutId) return; const o=R.midi.outputs.get(R.midiOutId); if(!o) return;
  if(R.midiNative&&d>0){ try{ o.send(bytes,performance.now()+d); }catch(e){} return; }
  // browsers that ignore send timestamps: one ordered queue, so messages due together leave in the order they were queued
  const q=R.mq||(R.mq=[]); q.push({due:due==null?performance.now():due,bytes,n:(R.mqN=(R.mqN||0)+1)});
  q.sort((a,b)=>a.due-b.due||a.n-b.n); midiPump();
}
function midiPump(){
  const q=R.mq; if(!q||!q.length) return;
  clearTimeout(R.mqT);
  const now=performance.now(), o=R.midi&&R.midi.outputs.get(R.midiOutId);
  while(q.length&&q[0].due<=now+1.5){ const m=q.shift(); if(o) try{ o.send(m.bytes); }catch(e){} }
  if(q.length) R.mqT=setTimeout(midiPump,Math.max(0,q[0].due-performance.now()-1));
}
function testStart(){
  initAudio(); if(!ctx) return;
  const st=$('#startNote'), m=S.tp.startMode;
  if(!midiReady()){ toast('Connect MIDI first.'); return; }
  if(m==='manual'){ toast('Pick a start method first.'); return; }
  if(R.playing||R.take){ toast('Stop playback first.'); return; }
  midiSend([0xB0,14,127]); st.textContent='Armed. Starting in 1 s…';
  setTimeout(()=>{ if(m==='start') midiSend([0xFA]); else if(m==='rocker') midiSend([0xB0,18,68]); else slate(ctx.currentTime+0.02); st.textContent='Started. The TP-7 should record for 4 s now.'; },1000);
  setTimeout(()=>{ if(m==='start') midiSend([0xFC]); else if(m==='rocker') midiSend([0xB0,18,64]); midiSend([0xB0,14,0]); st.textContent='Test done. Did the TP-7 record about 4 s? If not, try another method.'; },5000);

function pushUndo(i,tag){
  const last=R.undo[R.undo.length-1], now=Date.now();
  if(tag&&last&&last.i===i&&last.tag===tag&&now-last.at<3000){ last.at=now; return; }
  const s=S.sections[i]; R.undo.push({i,tag,at:now,d:JSON.stringify({chords:s.chords,drums:s.drums,bars:s.bars})});
  if(R.undo.length>40) R.undo.shift();
}
function undo(){
  const u=R.undo.pop(); if(!u){ toast('Nothing to undo.'); return; }
  Object.assign(S.sections[u.i],JSON.parse(u.d)); R.selEv=null; save(); renderSecs(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderGrid(); renderTL();
  toast(`Undid the last change in ${LETTERS[u.i]}.`);
}
function setBars(i,b){
  const s=S.sections[i]; if(s.bars===b) return; pushUndo(i);
  s.bars=b; s.chords=s.chords.filter(e=>e.s<b*16).map(e=>Object.assign({},e,{len:Math.min(e.len,b*16-e.s)}));
  if(R.playing&&R.cur===i&&R.secStep>=b*16) R.secStep=R.secStep%16;
  save(); renderSecs(); renderSecEdit(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderChainMeta(); renderTL(); renderTpInfo();
}
function copySec(i,j){
  pushUndo(j); const a=S.sections[i], b=S.sections[j];
  b.bars=a.bars; b.chords=JSON.parse(JSON.stringify(a.chords)); b.drums=JSON.parse(JSON.stringify(a.drums));
  save(); renderSecs(); renderSecEdit(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderGrid(); renderTL(); renderChainMeta();

}

/* waveform capture: peak envelope of everything the app sends out, 50 values per second */
const CAP_RATE=50;
function b64enc(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }

function startCapture(){
  if(!ctx) return;
  if(!A.cap){
    A.cap=ctx.createScriptProcessor(1024,2,1); A.capSink=ctx.createGain(); A.capSink.gain.value=0;
    A.cap.connect(A.capSink); A.capSink.connect(ctx.destination);
    A.cap.onaudioprocess=e=>{
      const c=R.cap; if(!c) return; if(c.t0==null) c.t0=e.playbackTime;
      const ib=e.inputBuffer, L=ib.getChannelData(0), Rr=ib.numberOfChannels>1?ib.getChannelData(1):L;
      for(let i=0;i<L.length;i++){ const a=Math.abs(L[i]), b=Math.abs(Rr[i]), m=a>b?a:b; if(m>c.acc) c.acc=m; if(++c.cnt>=c.per){ c.pk.push(c.acc); c.acc=0; c.cnt=0; } }
    };
  }
  try{ A.out.disconnect(A.cap); }catch(e){}
  A.out.connect(A.cap);
  R.cap={t0:null,acc:0,cnt:0,per:Math.round(ctx.sampleRate/CAP_RATE),pk:[]};
}
function stopCapture(k,z,mark){
  const c=R.cap; R.cap=null; try{ A.out.disconnect(A.cap); }catch(e){}
  if(!k||!c||c.t0==null||!c.pk.length||z==null) return;
  let t0=c.t0;
  // line the envelope up on the first known sound: the start beep or the first count-in click
  if(mark!=null){
    const from=Math.max(0,Math.floor((mark-t0-0.3)*CAP_RATE));
    for(let i=from;i<c.pk.length&&i<from+40;i++){ if(c.pk[i]>0.05){ const corr=t0+(i+0.5)/CAP_RATE-mark; if(corr>-0.2&&corr<0.3) t0-=corr; break; } }
  }
  const u=new Uint8Array(c.pk.length); for(let i=0;i<u.length;i++) u[i]=Math.min(255,Math.round(c.pk[i]*255));
  k.wave={rate:CAP_RATE,start:t0-z,data:b64enc(u)};
}

    if(d>max){ dx*=max/d; dy*=max/d; }

    let dir='c';
    if(d>r.width*0.1){ const a=Math.atan2(-dy,dx), idx=((Math.round(a/(Math.PI/4))%8)+8)%8; dir=['r','ur','u','ul','l','dl','d','dr'][idx]; }
    setDir(dir);
  };
  stick.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); try{ stick.setPointerCapture(e.pointerId); }catch(x){} stickPid=e.pointerId; stick.classList.add('drag'); move(e); });
  stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickPid) move(e); });
  const end=e=>{
    if(e.pointerId!==stickPid) return; stickPid=null; stick.classList.remove('drag');
    if(!S.latch||R.dir==='c'){ knob.style.transform=''; setDir('c'); }
  };
  stick.addEventListener('pointerup',end); stick.addEventListener('pointercancel',end);
}
function bindKeys(){
  const keys=$('#keys'), map=new Map();
  keys.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.key'); if(!b) return; e.preventDefault();
    try{ b.setPointerCapture(e.pointerId); }catch(x){}
    map.set(e.pointerId,b); b.classList.add('down'); keyDown(+b.dataset.deg);
  });
  const up=e=>{ const b=map.get(e.pointerId); if(!b) return; map.delete(e.pointerId); b.classList.remove('down'); keyUp(+b.dataset.deg); };
  keys.addEventListener('pointerup',up); keys.addEventListener('pointercancel',up); keys.addEventListener('lostpointercapture',up);
  $('#pads').addEventListener('pointerdown',e=>{
    const b=e.target.closest('.pad'); if(!b) return; e.preventDefault();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),90); padHit(+b.dataset.pad);
  });
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('.keys,.stick,.pads')) e.preventDefault(); });
}
function doAct(a,el){
  const i=el&&el.dataset.i!=null?+el.dataset.i:null;
  switch(a){
    case 'play': if(R.playing||(R.take&&R.take.phase==='run')) stop(); else play(0); break;
    case 'rec': initAudio(); R.recArmed=!R.recArmed; if(R.recArmed&&!R.playing) play(0); renderTransport(); break;
    case 'undo': undo(); break;
    case 'clear': confirmTap(el,'Sure?',()=>{ const k=R.laneSec<0?R.cur:R.laneSec; pushUndo(k); S.sections[k].chords=[]; R.selEv=null; save(); renderLane(k); renderSecs(); renderTL(); toast(`Cleared chords in ${LETTERS[k]}.`); }); break;
    case 'oct-': setK('octave',clamp(S.octave-1,-2,2)); break;
    case 'oct+': setK('octave',clamp(S.octave+1,-2,2)); break;
    case 'bpm-': setBpm(S.bpm-1); break;
    case 'bpm+': setBpm(S.bpm+1); break;
    case 'tap': tapTempo(); break;
    case 'drumClear': confirmTap(el,'Sure?',()=>{ pushUndo(R.cur); S.sections[R.cur].drums=pat6('empty'); save(); renderGrid(); renderSecs(); }); break;
    case 'secClear': confirmTap(el,'Sure?',()=>{ pushUndo(i); S.sections[i].chords=[]; S.sections[i].drums=pat6('empty'); R.selEv=null; save(); renderSecs(); renderLane(R.laneSec<0?R.cur:R.laneSec); renderGrid(); renderTL(); }); break;
    case 'rep-': S.chain[i].rep=Math.max(1,S.chain[i].rep-1); save(); renderChain(); break;
    case 'rep+': S.chain[i].rep=Math.min(16,S.chain[i].rep+1); save(); renderChain(); break;
    case 'up': if(i>0){ const t=S.chain[i-1]; S.chain[i-1]=S.chain[i]; S.chain[i]=t; save(); renderChain(); } break;
    case 'del': S.chain.splice(i,1); if(R.chainPos>=S.chain.length) R.chainPos=0; save(); renderChain(); break;
    case 'add': S.chain.push({sec:i,rep:1}); save(); renderChain(); break;
    case 'reset': confirmTap(el,'Tap again to erase everything',()=>{ if(R.playing) stop(); S=defaults(); seedDemo(); R.cur=0; R.undo=[]; save(); renderAll(); toast('Started a new project.'); }); break;
    case 'tone': toggleTone(); break;
    case 'take': if(R.take&&R.take.phase==='run') stop(); else startTake(); break;
    case 'midi': midiConnect(); break;
    case 'mRecOn': if(!midiReady()) toast('Connect MIDI first.'); midiSend([0xB0,14,127]); break;
    case 'mRecOff': if(!midiReady()) toast('Connect MIDI first.'); midiSend([0xB0,14,0]); break;
    case 'mStart': if(!midiReady()) toast('Connect MIDI first.'); midiSend([0xFA]); break;
    case 'mStop': if(!midiReady()) toast('Connect MIDI first.'); midiSend([0xFC]); break;
    case 'testStart': testStart(); break;
    case 'off-': S.tp.midiOffset=Math.max(-100,S.tp.midiOffset-5); save(); renderTpInfo(); break;
    case 'off+': S.tp.midiOffset=Math.min(100,S.tp.midiOffset+5); save(); renderTpInfo(); break;
    case 'mLoopOff': if(!midiReady()) toast('Connect MIDI first.'); midiSend([0xB0,17,0]); break;
    case 'copyTake': { const k=S.takes[i]; if(k) copyText(takeText(k),`Take ${k.n} notes`); break; }
    case 'copyTakes': if(!S.takes.length) toast('No takes yet.'); else copyText(S.takes.map(takeText).join('\n\n'),'All take notes'); break;
    case 'clearTakes': confirmTap(el,'Sure?',()=>{ S.takes=[]; save(); renderCues(); }); break;
    case 'chordsClear': confirmTap(el,'Sure?',()=>{ pushUndo(R.cur); curSec().chords=[]; R.selEv=null; edChanged(); }); break;
    case 'evL': evMove(-S.edSnap); break;
    case 'evR': evMove(S.edSnap); break;
    case 'evShort': evLen(-S.edSnap); break;
    case 'evLong': evLen(S.edSnap); break;
    case 'evDup': evDup(); break;
    case 'evDel': evDel(); break;
    case 'evDone': R.selEv=null; renderTL(); break;
    case 'openTake': openReview(i); break;
    case 'rvClose': closeReview(); break;
    case 'rvJump': rvJump(); break;
    case 'rvPlay': rvPlayFile(); break;
    case 'rvStop': stopReview(); break;
    case 'rvGo': stopReview(); WV.pos=+el.dataset.t; if(WV.zoom!=='fit'){ WV.view=WV.pos-rvVisible()*0.2; rvClampView(); } WV.dirty=true; break;
    case 'rvNudge': WV.fDown-=+el.dataset.d; rvBounds(); WV.dirty=true; toast(`File moved ${+el.dataset.d>0?'later':'earlier'} by 10 ms.`); break;
  }
}
function bindGlobal(){
  document.addEventListener('click',e=>{
    const t=e.target;
    const sb=t.closest('.seg button');
    if(sb){ const sg=sb.parentElement; if(sg.dataset.bars!=null){ setBars(+sg.dataset.bars,+sb.dataset.v); return; } if(sg.dataset.k){ setK(sg.dataset.k,parseV(sb.dataset.v)); return; } }
    const tg=t.closest('.tog[data-k]'); if(tg){ setK(tg.dataset.k,!getK(tg.dataset.k)); return; }
    const tab=t.closest('[data-tab]'); if(tab){ showTab(tab.dataset.tab); return; }
    const sec=t.closest('[data-sec]'); if(sec){ initAudio(); tapSection(+sec.dataset.sec); return; }
    const cell=t.closest('.cell'); if(cell){ const r=+cell.dataset.r, c=+cell.dataset.c, d=S.sections[R.cur].drums; pushUndo(R.cur,'grid'); d[r][c]=(d[r][c]+1)%3; cell.classList.toggle('on',d[r][c]===1); cell.classList.toggle('acc',d[r][c]===2); save(); renderSecs(); return; }
    const ck=t.closest('[data-ck]'); if(ck&&!t.closest('button:not(.ckbox)')){ toggleCk(ck.dataset.ck); return; }
    const act=t.closest('[data-act]'); if(act){ doAct(act.dataset.act,act); }
  });
  document.addEventListener('input',e=>{ const t=e.target; if(t.matches('input[type=range][data-k]')) setK(t.dataset.k,parseFloat(t.value)); });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.matches('select[data-k]')) setK(t.dataset.k,parseV(t.value));
    else if(t.dataset.name!=null){ const i=+t.dataset.name; S.sections[i].name=t.value.trim()||LETTERS[i]; save(); renderSecs(); renderChain(); renderSecEdit(); }
    else if(t.dataset.copy!=null&&t.value!==''){ copySec(+t.dataset.copy,+t.value); t.value=''; }
    else if(t.id==='patSel'&&t.value){ pushUndo(R.cur); S.sections[R.cur].drums=pat6(t.value); t.value=''; save(); renderGrid(); renderSecs(); }
    else if(t.id==='midiOut') R.midiOutId=t.value;
  });
  const KD={q:'ul',w:'u',e:'ur',a:'l',d:'r',z:'dl',x:'d',c:'dr'}, held=[];
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!$('#review').hidden){ closeReview(); return; }
    if(!$('#review').hidden) return;
    if(e.target.matches('input,select,textarea')||e.repeat||e.metaKey||e.ctrlKey) return;
    const k=e.key.toLowerCase();
    if(k>='1'&&k<='7'){ const d=+k-1; keyDown(d); const b=document.querySelector(`.key[data-deg="${d}"]`); if(b) b.classList.add('down'); }
    else if(KD[k]){ held.push(k); setDir(KD[k]); }
    else if(k===' '){ e.preventDefault(); doAct('play',null); }
    else if(k==='r') doAct('rec',null);
  });
  document.addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(k>='1'&&k<='7'){ const d=+k-1; keyUp(d); const b=document.querySelector(`.key[data-deg="${d}"]`); if(b) b.classList.remove('down'); }
    else if(KD[k]){ const ix=held.indexOf(k); if(ix>=0) held.splice(ix,1); if(held.length) setDir(KD[held[held.length-1]]); else if(!S.latch) setDir('c'); }
  });
  document.addEventListener('pointerdown',()=>{ if(ctx&&ctx.state!=='running') ctx.resume().catch(()=>{}); },true);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ctx&&ctx.state!=='running') ctx.resume().catch(()=>{}); if(!document.hidden&&R.playing) requestWake(); });
  $('#startBtn').addEventListener('click',()=>{ initAudio(); $('#start').hidden=true; });
}

/* per-frame display */
const mbuf=new Float32Array(1024);
function peakOf(an){ an.getFloatTimeDomainData(mbuf); let m=0; for(let i=0;i<mbuf.length;i++){ const a=Math.abs(mbuf[i]); if(a>m) m=a; } return m; }
function frame(){
  requestAnimationFrame(frame);
  if(!ctx) return;
  const now=ctx.currentTime;
  let latest=null; while(R.disp.length&&R.disp[0].at<=now) latest=R.disp.shift();
  if(latest){ $('#sChord').textContent=latest.name; $('#sNum').textContent=latest.num; }
  const h=R.playing||R.take?histAt(now):null, ph=$('#playhead'), cnt=$('#count');
  let heard=R.cur;
  if(h&&h.sec==null){
    cnt.hidden=false; $('#countN').textContent=Math.ceil(-h.abs/16);
    $('#countT').textContent=R.take?startHint('pre',R.take.startMode):'Count-in';
    $('#countS').textContent=R.take&&S.tp.slate?'Slate beep plays one bar before the downbeat':'';
  } else cnt.hidden=true;
  if(h&&h.sec!=null&&(R.playing||now<h.time+h.dur*2)){
    heard=h.sec; if(R.laneSec!==heard) renderLane(heard);
    const s=S.sections[heard], len=s.bars*16, pos=(h.secStep+clamp((now-h.time)/h.dur,0,1))/len;
    ph.hidden=false; ph.style.left=(pos*100)+'%';
    $('#sSec').textContent=LETTERS[heard]+' '+s.name;
    $('#sBar').textContent=`bar ${Math.floor(h.secStep/16)+1} of ${s.bars}, beat ${Math.floor((h.secStep%16)/4)+1}`;
    const ach=activeChain(), secTake=R.take&&S.tp.takeMode==='loop';
    $('#sNext').textContent=ach?(secTake?`pass ${R.rep+1}${isFinite(ach[0].rep)?'/'+ach[0].rep:''}`:`song ${R.chainPos+1}/${ach.length}`):R.queued!=null?'next '+LETTERS[R.queued]:'';
    if(R.tab==='drums'&&heard===R.cur){ const c=h.secStep%16; if(c!==R.gridCol){ $$('#grid .cell.now').forEach(x=>x.classList.remove('now')); $$(`#grid .cell[data-c="${c}"]`).forEach(x=>x.classList.add('now')); R.gridCol=c; } }
  } else if(!(h&&h.sec==null)){
    ph.hidden=true; if(R.laneSec!==R.cur) renderLane(R.cur);
    $('#sSec').textContent=LETTERS[R.cur]+' '+S.sections[R.cur].name; $('#sBar').textContent='stopped'; $('#sNext').textContent='';
    if(R.gridCol!==-1){ $$('#grid .cell.now').forEach(x=>x.classList.remove('now')); R.gridCol=-1; }
  }
  if(R.tab==='chords'){
    const tph=$('#tph');
    if(tph){
      if(R.playing&&h&&h.sec!=null&&h.sec===R.cur){
        const tg=document.querySelector(`#tl .tg[data-bar="${Math.floor(h.secStep/16)}"]`);
        if(tg){ if(tph.parentElement!==tg) tg.appendChild(tph); tph.hidden=false; tph.style.left=((h.secStep%16+clamp((now-h.time)/h.dur,0,1))/16*100)+'%'; }
      } else tph.hidden=true;
    }
  }
  const mark=heard+':'+(R.queued==null?'':R.queued)+':'+R.cur;
  if(mark!==R.secMark){ R.secMark=mark; $$('.sec').forEach((b,i)=>{ b.classList.toggle('cur',i===heard); b.classList.toggle('q',i===R.queued); }); if(R.tab==='drums'&&R.gridSec!==R.cur){ R.gridSec=R.cur; renderGrid(); } if(R.tlSec!==R.cur){ R.selEv=null; renderTL(); renderTpInfo(); } }
  if(R.tab==='song'&&R.chainMark!==(R.playing&&S.songMode?R.chainPos:-1)){ R.chainMark=R.playing&&S.songMode?R.chainPos:-1; $$('#chain li').forEach((li,i)=>li.classList.toggle('now',i===R.chainMark)); }
  if(R.tab==='rec'&&(!R.tkAt||now-R.tkAt>0.2)){
    R.tkAt=now; const st=takeState(now), a=$('#tkState'), b=$('#tkSmall');
    if(a.textContent!==st.big) a.textContent=st.big; if(b.textContent!==st.small) b.textContent=st.small; a.classList.toggle('rec',st.rec);
  }
  // meters
  const pk=[peakOf(A.anL),peakOf(A.anR)];
  pk.forEach((p,i)=>{ R.meterHold[i]=Math.max(p,R.meterHold[i]*0.93); const db=20*Math.log10(R.meterHold[i]+1e-9), l=clamp((db+48)/48,0,1); $(i?'#mR':'#mL').style.clipPath=`inset(${(1-l)*100}% 0 0 0)`; });
  const top=Math.max(pk[0],pk[1]); if(top>0.98) R.clipAt=now; $('#meter').classList.toggle('clip',now-R.clipAt<1);
  R.peaks.push({t:now,p:top}); while(R.peaks.length&&R.peaks[0].t<now-3) R.peaks.shift();
  if(R.tab==='rec'&&(!R.peakAt||now-R.peakAt>0.25)){ R.peakAt=now; const m=R.peaks.reduce((a,x)=>Math.max(a,x.p),0); $('#peakOut').textContent=m<0.0005?'Peak: silent':`Peak ${(20*Math.log10(m)).toFixed(1)} dBFS`; }
  if(R.playing!==R.shownPlaying||(R.take&&R.take.phase)!==R.shownTake){ R.shownPlaying=R.playing; R.shownTake=R.take&&R.take.phase; renderTransport(); }
}
function renderAll(){
  R.selEv=null; renderInfo(); renderKeys(); renderTransport(); renderSecs(); renderLane(R.cur); renderGrid(); renderSecEdit(); renderChain(); renderCues(); renderPal(); renderTL(); renderTpInfo(); syncControls();
}

/* ================= INIT ================= */
S=load(); if(!S){ S=defaults(); seedDemo(); }
if(S.tp.takeMode==='section') S.tp.takeMode='loop';
if(!['loop','jam','song'].includes(S.tp.takeMode)) S.tp.takeMode='loop';
if(!Array.isArray(S.takes)) S.takes=[]; if(!S.tp.startMode) S.tp.startMode='start'; if(S.tp.clock==null) S.tp.clock=true; if(S.tp.midiOffset==null) S.tp.midiOffset=0; if(S.tp.cueEvery==null) S.tp.cueEvery=1; if(!S.tp.chk||typeof S.tp.chk!=='object') S.tp.chk={};
buildPanels(); bindStick(); bindKeys(); bindChords(); bindReview(); bindGlobal();
R.tab='play'; renderAll(); requestAnimationFrame(frame);
</script>
