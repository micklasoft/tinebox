    if(st==='rec'&&TPL.rec&&TPL.rec.ses){ if(TPL.rec.which===1){ tplSay('Recording Tinebox: switch 5 closes this loop.'); return; } return tplCloseSes(); }
    if(st==='prep'){ tplSay('Getting the TP-7 ready: press record once the metronome runs.'); return; }
    if(st==='go') return;
    if(st==='ready'&&TPL.session) return tplRecNow(0);
    if(st==='rec'){ const g=TPL.rec; if(g&&g.k===0&&ctx.currentTime<g.z+0.25*tplK().bar){ tplSay('Recording starts after the count-in: tap again at the end of your loop.'); return; }
      return tplEndFirst(ctx.currentTime,{follow:!!(g&&g.k===0&&S.tp.tempoFollow!==false)}); }
    if(tplLooping()) return tplRecToggle(0);
    if(['closing','gap','cue'].includes(st)){ TPL.pendingRec=TPL.pendingRec==null?0:null; tplSay(TPL.pendingRec==null?'Layer cancelled.':'The layer starts as soon as the loop runs. Tap again to cancel.'); return; }
    if(st==='next'){ toast('The new section starts at the end of this time round. Tap record after that to close it.'); return; }
    if(tplBusy()){ toast('Wait: the TP-7 is busy.'); return; }
    if(st==='ready'&&!TPL.regions.length&&TPL.file) return tplFirstNow();
    if(!TPL.regions.length||TPL.fresh) return tplAct2('tplStart',el,st);
    TPL.pendingRec=0; return tplPlayFrom(TPL.cur||0); }
  if(a==='tplTine'){
    if(st==='rec'&&TPL.rec&&TPL.rec.ses){ if(TPL.rec.which===1) return tplCloseSes(); tplSay('Recording guitar: switch 1 closes this loop.'); return; }
    if(st==='prep'){ tplSay('Getting the TP-7 ready: press once the metronome runs.'); return; }
    if(st==='ready'&&TPL.session) return tplRecNow(1);
    if(tplLooping()) return tplRecToggle(1); toast(TPL.st==='idle'?'Tap switch 6 four times for a session first.':'Record Tinebox works while a section loops.'); return; }
  if(a==='tplPlay'||a==='tplStop'){
    if(st==='rec'&&TPL.rec&&TPL.rec.ses&&TPL.rec.k===0&&tplP2T(performance.now())<TPL.rec.z+tplK().bar) return tplCancelFirst();
    if(st==='go') return;
    if(st==='ready'&&TPL.session&&a==='tplPlay'){ TPL.metro=TPL.metro===false; if(!tplClockOn()) tplClockAt(tplTapZ()); pedLog('st',`metronome ${TPL.metro?'on':'off'}`); tplSay(`Metronome ${TPL.metro?'on':'off'}. ${tplReadyTxt()}`); tplRender(); return; }
    if(st==='rec'){ if(TPL.rec&&ctx.currentTime<TPL.rec.z-0.05){ await tplStop(); tplSay('Stopped in the count-in: nothing was recorded. Tap record to start again.'); return; } return tplEndFirst(TPL.rec&&TPL.rec.ses?tplP2T(performance.now()):ctx.currentTime,{stop:true}); }
    if(tplLooping()||TPL_CUTSHORT.includes(st)){ await tplStop(); return; }
    if(TPL_STOPLATER.includes(st)){ TPL.stopReq=true; tplSay(st==='prep'?'The metronome stays off once the TP-7 is ready.':st==='new'?'Stopping once the new recording is made…':st==='clear'?'Stopping once the section is cleared…':'Stopping once the print is done…'); return; }
    if(a==='tplStop'){ await tplStop(); return; }
    if(TPL.regions.length){ TPL.fresh=false; return tplPlayFrom(TPL.cur||0); }
    doAct('play'); pedLog('st',R.playing?'no looper song: Tinebox plays':'no looper song: Tinebox stopped'); return; }
  if(a==='tplNext'){
    if(tplLooping()){ const m=await tplNext(Object.assign(tplSecInfo(),{sched:tplTinebox})); R.queued=null; if(m) tplSay(m); return; }
    if(st==='rec') return; if(tplBusy()){ toast('Wait: changing over.'); return; }
    if(TPL.regions.length>(TPL.cur||0)+1) return tplGoto((TPL.cur||0)+1);
    toast('Next records a new section while the last one loops.'); return; }
  if(a==='tplPrev'){ if(st==='rec'||tplBusy()) return; if(TPL.regions.length) return tplGoto(Math.max(0,(TPL.cur||0)-1)); return; }
  if(a==='tplClear'){ if(!(tplLooping()||st==='stopped')) return; const was=tplLooping(), k=TPL.cur||0; await tplStop(); const m=await tplClear(k);
    const nm=TPL.regions[k]?LETTERS[TPL.regions[k].sec]||'?':'?'; if(m){ TPL.st='stopped'; tplSay(m); return; }
    toast('Section cleared.'); if(TPL.stopReq||!was){ TPL.stopReq=false; TPL.st='stopped'; tplSay(`Section ${nm} cleared.`); return; }
    TPL.st='cue'; const G=TPL.gen, m2=await tplListen(k,{sched:tplTinebox,G}); if(m2){ if(TPL.st==='cue') TPL.st='stopped'; tplSay(m2); } return; }
  if(a==='tplClear2'){ // the second of two quick taps of switch 2: the first already played or stopped; clear the section and stay stopped
    if(TPL_STOPLATER.includes(st)||['rec','closing','gap','next','go'].includes(st)){ toast('A double tap clears while a section loops or is stopped.'); return; }
    if(!TPL.regions.length) return; const k=TPL.cur||0; await tplStop(); const m=await tplClear(k); TPL.st='stopped';
    tplSay(m||`Section ${TPL.regions[k]?LETTERS[TPL.regions[k].sec]||'?':'?'} cleared.`); if(!m) toast('Section cleared.'); return; }
  if(a==='tplPrint'){ if(tplBusy()||st==='rec') return; await tplStop(); const m=await tplPrint(); TPL.stopReq=false; if(m) tplSay(m); return; }
  if(a==='tplTap') return tplTapSession();
}
// the first pass of a new song, on the recording tplNew made; a stop while it was made leaves it ready
async function tplFirstNow(){ if(TPL.stopReq){ TPL.stopReq=false; TPL.st='ready'; tplSay('Stopped. The new recording is ready: tap record to start.'); return; }
  TPL.st='ready'; const m=await tplFirst({sec:R.cur,bars:S.sections[R.cur].bars,sched:tplTinebox,autoKey:!R.pedLive}); if(m) tplSay(m); }
// play the song from region k (from a stop): the looper counts as busy ('cue') until the tape runs
async function tplPlayFrom(k){ TPL.st='cue'; const G=TPL.gen, r=await tpEditTo(0,TPL.input); TPL.trk=0; if(G!==TPL.gen) return; if(!r.ok){ TPL.st='stopped'; TPL.pendingRec=null; tplSay(r.why); return; }
  const m=await tplListen(k,{sched:tplTinebox,G}); if(m){ if(TPL.st==='cue') TPL.st='stopped'; tplSay(m); } }

// --- footswitch input
const pedTyping=t=>!!(t&&t.matches&&(t.matches('textarea,[contenteditable="true"]')||(t.matches('input')&&!/^(range|checkbox|radio|button|submit|reset|color|file)$/i.test(t.type||'text'))));
Object.assign(PED,{up:[],kd:[],rep:[0,0,0,0,0,0],gate:null,probe:null,probeRaw:null});
function pedIn(src,i,on,port,pc,meta){ const now=performance.now(); PED.last={src,i,on,port,at:now}; pedFlash(i,on);
  pedLog('in',`switch ${i+1} ${on?'down':'up'}${src==='key'?' (key)':''}${meta?' '+meta:''}`);
  if(PED.probe){ PED.probe(src,i,on,port,now,meta); return; }
  if(PED.learn){ PED.learn(src,i,on,port,now); return; }
  if(PED.tap&&on){ PED.tap(i,now); return; }
  if(PED.gate&&!PED.gate(i,on,now)) return;
  if(pc){ pedAct(i,true); setTimeout(()=>pedAct(i,false),150); return; }
  if(on){ if(PED.down[i]){ if(now-PED.t[i]<60) return; pedLog('in',`switch ${i+1}: its release never came; counted as released`); pedAct(i,false); PED.up[i]=-1e9; }
    if(now-(PED.up[i]==null?-1e9:PED.up[i])<45){ pedLog('in',`switch ${i+1}: contact bounce ignored`); return; } }
  else if(!PED.down[i]) return;
  pedAct(i,on); if(!on) PED.up[i]=now; }
function pedMidi(d,port,now){ if(PED.learn){ PED.learn('midi',d,null,port,now); return; } if(PED.probeRaw) PED.probeRaw('midi',d,port);
  const P=pedS(); if(P.mode==='keys') return; if(P.port&&port!==P.port&&!P.port.includes(port)&&!port.includes(P.port)) return;
  const x=pedIdxMidi(d); if(x) pedIn('midi',x.i,x.on,port,x.pc); }
// keyboard mode: the six keys go to the pedal, also when a menu, slider or button has focus (never while you type in a text field)
['keydown','keyup'].forEach(ev=>window.addEventListener(ev,e=>{ const k=keyOf(e), P=pedS(), i=P.keys.indexOf(k);
  if(PED.learn&&ev==='keydown'&&!e.repeat&&k&&!/^(Shift|Meta|Control|Alt)$/.test(k)){ e.preventDefault(); e.stopImmediatePropagation(); PED.learn('key',k,true,'keyboard',performance.now()); return; }
  if(PED.learn&&ev==='keyup'&&k){ e.preventDefault(); e.stopImmediatePropagation(); PED.learn('key',k,false,'keyboard',performance.now()); return; }
  if(PED.probeRaw) PED.probeRaw('key',{k,ev,rep:!!e.repeat,tag:e.target&&e.target.tagName||''},'keyboard');
  if(i<0||P.off||P.mode==='midi'||pedTyping(e.target)) return;
  e.preventDefault(); e.stopImmediatePropagation(); const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur();
  const now=performance.now();
  if(ev==='keyup'){ pedIn('key',i,false,'keyboard'); return; }
  if(e.repeat){ PED.kd[i]=now; PED.rep[i]++; return; }
  if(PED.down[i]&&now-(PED.kd[i]||0)<250){ PED.kd[i]=now; PED.rep[i]++; return; } // a repeat without the repeat flag
  PED.kd[i]=now; pedIn('key',i,true,'keyboard');
  if(P.keyUp===false) setTimeout(()=>{ if(PED.down[i]) pedIn('key',i,false,'keyboard','(the pedal sends no release)'); },120); },true));
function pedAct(i,on){ const a=pedS().acts[i], held=PED.down[i]; PED.down[i]=on?1:0; PED.t[i]=performance.now(); clearTimeout(PED.timers[i]);
  if(R.dgBusy&&!R.pedLive){ if(on) toast('A diagnostics test is running.'); return; }
  const go=x=>{ pedLog('do',`switch ${i+1}: ${x.replace(/^tpl/,'')} (looper ${TPL.st})`); tplAct(x).catch(err=>pedLog('err',String(err&&err.message||err))); };
  // play/stop acts on release, so that holding it 2 s can clear the section instead
  if(a==='play'){ if(on){ PED.timers[i]=setTimeout(()=>{ if(PED.down[i]===1){ PED.down[i]=2; go('tplClear'); } },2000); return; }
    if(held!==1) return; const now=performance.now(), dbl=now-(PED.lastPlay==null?-1e9:PED.lastPlay)<450; PED.lastPlay=dbl?null:now; go(dbl?'tplClear2':'tplPlay'); return; }
  if(!on) return;
  if(a==='rec') go('tplRec'); else if(a==='tine') go('tplTine'); else if(a==='next') go('tplNext'); else if(a==='prev') go('tplPrev');
  else if(a==='tap') go('tplTap'); else if(a==='tempo'){ if(tplLooping()||tplBusy()||TPL.st==='rec'){ toast('Stop first: the tempo changes between songs.'); return; } tplStrumTempo(); } }
document.addEventListener('click',async e=>{ if(!e.target.closest||!e.target.closest('#pedCopy')) return; const txt=pedLogText();
  try{ await navigator.clipboard.writeText(txt); toast('Footswitch log copied. Paste it into our chat.'); }catch(err){ toast('Copy failed: open diagnostics and copy the report instead.'); } });

// =============================================================================================== tests
// Prompts: a large banner over the diagnostics screen, so you can read it with the phone on the floor
const PP={iv:null,main:''};
function ppShow(main,sub,beat){ let el=$('#pedPrompt'); if(!el){ el=document.createElement('div'); el.id='pedPrompt'; el.className='ped-prompt'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
    el.innerHTML='<b id="ppMain"></b><span id="ppSub"></span><span id="ppBeat"></span>'; document.body.appendChild(el); }
  PP.n=(PP.n||0)+1; PP.main=main||''; el.hidden=!main; $('#ppMain').textContent=main||''; $('#ppSub').textContent=sub||''; if(beat!==undefined) $('#ppBeat').textContent=beat||''; }
// the beat counter: count-in, bar and beat of the pass being recorded, or the time round of a loop; NOW on the beat to tap
function ppBeats(target){ clearInterval(PP.iv); const el=()=>$('#ppBeat'); if(!target&&target!==0){ if(el()) el().textContent=''; return; }
  if(target&&target.auto){ const p=TPL.passT, {bar}=tplK(), t=p&&ctx?ctx.currentTime-p.z:0, need=t+Math.max(2,bar); let b=2; while(b*bar<need) b+=2; target.bar=b+1; target.beat=1; PP.target=b; }
  PP.iv=setInterval(()=>{ const e=el(); if(!e||!ctx) return; const p=TPL.passT; if(!p){ e.textContent=''; return; } const {beat}=tplK(), t=ctx.currentTime-p.z;
    if(t<0){ e.textContent=t>-4*beat-0.05?`count-in ${Math.min(4,Math.floor((t+4*beat)/beat)+1)}`:''; e.classList.remove('now'); return; }
    const n=Math.floor(t/beat), loopN=TPL.st==='rec'?null:Math.round(p.L/beat), m=loopN?n%loopN:n, bar=Math.floor(m/4)+1, b=m%4+1, now=target&&bar===target.bar&&b===target.beat;
    e.textContent=now?'NOW':`${loopN?`time round ${Math.floor(n/loopN)+1} · `:''}bar ${bar} · beat ${b}`; e.classList.toggle('now',!!now); },30); }
// the test stands in for your guitar: a tone on every beat of the pass, one pitch per step, so one playback shows what landed where.
// PT.w: [{f, from, to}] windows in app time; a beat in a window gets that window's pitch.
const PT={w:[],z:null,last:null,iv:null};

function ptStart(){ clearInterval(PT.iv); PT.w=[]; PT.z=null; PT.iv=setInterval(()=>{ if(!ctx) return; const p=TPL.passT; if(!p) return; const {beat}=tplK(), now=ctx.currentTime;
    if(p.z!==PT.z){ PT.z=p.z; PT.last=Math.ceil((now-p.z)/beat)-1; }
    for(let n=PT.last+1;;n++){ const t=p.z+n*beat; if(t>now+0.1) break; PT.last=n; if(t<now+0.012||n<0) continue; const w=PT.w.find(x=>t>=x.from&&t<x.to); if(w) burst(t,w.f); } },20); }
function ptStop(){ clearInterval(PT.iv); PT.iv=null; PT.w=[]; }

// waiting for the switch the step asks for: other switches are refused (and noted); the asked one goes on to the looper as in use
const PL={ex:null,wrong:[],L:[],ok:0,bad:0};
function plGate(j,on,now){ if(!on) return true; const x=PL.ex, want=x?(Array.isArray(x.i)?x.i[x.hits.length]:x.i):null; if(x&&j===want){ x.hits.push({t:now,c:ctx.currentTime,st:TPL.st}); if(x.hits.length>=x.n){ PL.ex=null; clearTimeout(x.to); setTimeout(()=>x.res(x.hits),x.after||0); } return !x.hold; }
  const w=`switch ${j+1} pressed${x?` (switch ${want+1} asked for)`:' when nothing was asked'}`; PL.wrong.push(w); pedLog('test',w); if(x) ppShow(x.main,`That was switch ${j+1}. Press switch ${want+1}.`); return false; }
function plWait(i,main,sub,o){ o=o||{}; ppShow(main,sub); pedLog('test',`asks: ${main}`); return new Promise(res=>{ const x={i,n:o.n||1,hits:[],main,res,hold:o.hold,after:o.after}; x.to=setTimeout(()=>{ if(PL.ex===x) PL.ex=null; res(x.hits.length?x.hits:null); },o.ms||30000); PL.ex=x; }); }
const plUntil=(fn,ms)=>waitFor(fn,ms,40);
function plChk(name,ok,detail){ PL.L.push(`${ok===null?'·':ok?'✓':'✗'} ${name}${detail?`: ${detail}`:''}`); if(ok===true) PL.ok++; if(ok===false) PL.bad++; pedLog('test',`${ok===null?'note':ok?'pass':'FAIL'}: ${name}${detail?' ('+detail+')':''}`); }
const tpArmSeen=(v,since)=>R.tpNotes&&R.tpNotes.some(x=>x[1]==='armed'&&x[2]===v&&x[0]>=since);
const tpNoteTxt=(v,since,what)=>!R.tpNotes||!R.tpNotes.some(x=>x[1]==='armed')?'the TP-7 sent no armed reports':tpArmSeen(v,since)?`the TP-7 reported armed = ${v}`:`no armed = ${v} report from the TP-7${what?' '+what:''}`;
async function plBegin(id){ const P=pedS(); if(!P.learned) return 'Learn the pedal first: test 1, Learn.';
  PL.ex=null; PL.wrong=[]; PL.L=[]; PL.ok=0; PL.bad=0; PL.id=id; PL.mix=[R.muteK,R.muteD,S.metro]; R.muteK=true; R.muteD=true; S.metro=false; applyMix();
  R.pedLive=true; PED.gate=plGate; TPL.maxListen=1; ptStart(); pedLog('test',`${id} begins`); await tplStop();
  // each run starts the looper afresh: it makes its own TP-7 recording
  Object.assign(TPL,{regions:[],st:'idle',owner:null,loop:null,rec:null,cur:0,key:null,fresh:false,pendingRec:null,session:false}); S.tplSave=null; save(); return ''; }
async function plEnd(){ PL.ex=null; PED.gate=null; ppBeats(null); ppShow(''); ptStop(); await tplStop(); R.pedLive=false;
  if(PL.mix){ [R.muteK,R.muteD,S.metro]=PL.mix; PL.mix=null; applyMix(); } const b=await tpEditTo(0,TPIN.line1); TPL.input=TPIN.line1; pedLog('test',`ends; TP-7 back to ${trIn(b)}`); return b; }


// test 1, Check: does every switch arrive once, with its release, and does nothing else get in the way
async function runPedCheck(){ const id='tPed', L=[], P=pedS(); let ok=true;

  if(mode!=='keys'&&!R.midi&&!nativeMidi()) await midiConnect(); else if(R.midi) midiList();
  L.push(`Check, ${new Date().toLocaleTimeString()}: ${P.learned?`learned ${P.learned}`:'not learned: default messages'}${mode?`; listening to ${mode==='keys'?'keys only':'MIDI only'+(P.port?` from ${P.port}`:'')}`:''}.`);
  const ev=[], raw=[]; PED.probe=(src,i,on,port,t,meta)=>ev.push({i,on,t,src,meta}); PED.probeRaw=(src,d,port)=>raw.push({src,d,port,t:performance.now()});
  const nextDown=(ms,after)=>waitFor(()=>ev.some(x=>x.on&&x.t>after),ms,20);
